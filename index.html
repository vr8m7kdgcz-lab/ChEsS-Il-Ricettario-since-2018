["Song of the Siren", "Hurricane", "Shake (ghiaccio tritato)", "", ["30 ml rhum agricole 100 proof", "15 ml mezcal", "15 ml crème de cacao", "15 ml succo di ananas", "22,5 ml succo di lime", "7,5 ml Braulio (float)"], "foglia di banano, noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti tranne il Braulio con ghiaccio a cubetti e versate in un bicchiere hurricane (o pilsner) foderato con una foglia di banano. Completate con ghiaccio tritato e fate galleggiare l’amaro in superficie. Infine, decorate con noce moscata appena grattugiata."]], "Tiki & Rum", 1],
["Muertito Vivo", "Tiki", "Shake", "", ["45 ml rum extra invecchiato", "15 ml rum demerara overproof", "22,5 ml Jägermeister", "22,5 ml Don’s Mix", "22,5 ml succo di lime"], "2 stecche di cannella, fiore edibile", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un Tiki mug a teschio (o in un tumbler basso ghiacciato) su ghiaccio tritato. Infine, decorate con 2 stecche di cannella e un fiore edibile."], ["Nota", "Versione semplificata dello Zombie."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Infernal Triangle", "Tiki", "Shake (ghiaccio tritato)", "", ["30 ml cachaça invecchiata", "15 ml mezcal", "15 ml liquore al chile ancho", "15 ml tepache", "15 ml liquore alla banana", "22,5 ml sciroppo di miele speziato", "7,5 ml succo di ananas", "22,5 ml succo di lime", "2 dash angostura (float)"], "foglia di banano, rondella di lime incisa, noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti tranne il bitter con ghiaccio e versate in un Tiki mug (o a teschio) foderato con una foglia di banano. Completate con ghiaccio tritato e fate galleggiare il bitter in superficie. Infine, decorate con una rondella di lime incisa e noce moscata appena grattugiata."], ["Nota", "Tepache: vedi la ricetta dell’Aguila de Desierto."], ["Sciroppo di miele speziato", "Preparate lo sciroppo di miele 1:1 usando le spezie dello sciroppo speziato (3-4 stecche di cannella tostate e circa 1 g di chiodi di garofano interi). Filtrate ed eliminate le spezie a sciroppo freddo. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Abeille", "Tumbler alto", "Shake (ghiaccio tritato)", "", ["45 ml rhum agricole blanc infuso alle spezie (sous vide)", "15 ml Chartreuse gialla", "7,5 ml assenzio", "15 ml purea di guava", "15 ml sciroppo di vaniglia", "22,5 ml succo di lime", "2 dash angostura (float)"], "fiore edibile, guscio di lime inciso", [["Preparazione", "Shakerate tutti gli ingredienti tranne il bitter con ghiaccio a cubetti e filtrate in un tumbler alto su ghiaccio. Completate con ghiaccio tritato e fate galleggiare il bitter in superficie. Infine, decorate con un fiore edibile e un guscio di lime inciso."], ["Rhum agricole infuso alle spezie (sous vide)", "Unite 1 baccello di vaniglia aperto, 2-3 stecche di cannella e circa 30 g di rondelle di zenzero fresco (ricavate da 1 pezzo non sbucciato) con 750 ml di rhum agricole blanc in un sacchetto sottovuoto per alimenti e sigillate bene, eliminando più aria possibile. Mettete il sacchetto in una pentola grande, fissate a lato l’asta sous vide e riempite d’acqua finché sacchetto e asta sono completamente immersi, lasciando circa 5 cm sopra il livello dell’acqua (non riempite troppo). Seguendo le istruzioni dell’asta sous vide, impostate a 60 °C per 2 ore: per un sapore più marcato si può provare con tempi più lunghi. Togliete il sacchetto dal bagnomaria e lasciate raffreddare. Filtrate il rum infuso con una garza eliminando i solidi. Travasate in una bottiglia pulita ed ermetica e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Nota", "Si può usare crème de cacao al posto dello sciroppo nell’infusione: si salta il passaggio di infusione, ma il risultato è un drink più dolce e meno intenso."], ["Sciroppo di vaniglia", "Due modi: aggiungete fino a 15 ml di estratto di vaniglia all’acqua della ricetta dello sciroppo Demerara; oppure, per lo stile autentico dei classici Tiki bar, versate lo sciroppo semplice caldo su 1 baccello di vaniglia aperto per il lungo in un barattolo o una bottiglia di vetro e lasciate raffreddare. Con l’estratto si conserva in frigorifero fino a 2 settimane, con il baccello 1 settimana."]], "Tiki & Rum", 1],
["Leatherbound", "Pilsner", "Stir", "", ["60 ml acquavite infusa all’anice", "7,5 ml orange curaçao", "7,5 ml Amargo Vallet", "7,5 ml assenzio", "15 ml sciroppo di caffè", "top stout scura"], "anice stellato tostato", [["Preparazione", "Mescolate tutti gli ingredienti tranne la stout in un mixing glass con ghiaccio per circa 10 secondi, per raffreddare. Filtrate in un bicchiere pilsner ghiacciato su ghiaccio tritato. Completate con la stout e decorate con un anice stellato tostato."], ["Nota", "Acquavite infusa all’anice: vedi la ricetta del Cicada."], ["Sciroppo di caffè", "Seguite la ricetta dello sciroppo semplice usando caffè preparato al posto dell’acqua. Per un sapore più intenso e potente si può fare un caffè double-brew (metà della quantità di acqua usuale). Si consigliano caffè monorigine scuri (Messico, Guatemala, Sumatra) o una miscela con uno o più di questi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["One Love", "Tumbler alto", "Shake", "", ["60 ml vodka lavata all’olio di cocco", "15 ml crème de cacao", "30 ml sciroppo di miele", "15 ml succo di ananas", "22,5 ml succo di lime"], "spicchio di ananas, spiedo di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler alto su ghiaccio. Completate con ghiaccio tritato e decorate con uno spicchio e uno spiedo di ananas."], ["Vodka lavata all’olio di cocco", "Unite 360 ml di olio di cocco non raffinato (necessario per l’effetto desiderato: quello raffinato è inodore e insapore) e 1 litro di vodka in un contenitore di vetro o non poroso e non reattivo con coperchio. Agitate per mescolare, poi lasciate in infusione a temperatura ambiente per 4-6 ore. Trasferite nel freezer per almeno 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate due volte con una garza prima di usare. La vodka lavata all’olio di cocco si conserva a tempo indefinito in un contenitore ermetico in frigorifero."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Tiger’s Milk", "Noce di cocco", "Flash Blend (ghiaccio tritato)", "", ["60 ml rye whiskey lavato all’olio di cocco", "15 ml liquore al tamarindo", "15 ml sciroppo di caffè", "30 ml crema di cocco", "22,5 ml succo di limone"], "cannella grattugiata, cacao in polvere", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con ghiaccio tritato. Frullate con mixer a immersione per 10-15 secondi, poi versate in un guscio di cocco giovane (posato in una base di cocco), in una Tiki bowl monoporzione o in un mug di bambù avvolto in una foglia di banano. Infine, decorate con cannella grattugiata e una spolverata di cacao in polvere."], ["Nota", "Il rye va lavato all’olio di cocco come il bourbon del Tigershark."], ["Sciroppo di caffè", "Seguite la ricetta dello sciroppo semplice usando caffè preparato al posto dell’acqua. Per un sapore più intenso e potente si può fare un caffè double-brew (metà della quantità di acqua usuale). Si consigliano caffè monorigine scuri (Messico, Guatemala, Sumatra) o una miscela con uno o più di questi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["River Styx", "Snifter", "Shake", "", ["30 ml tequila infusa all’habanero", "15 ml aquavit", "15 ml rum giamaicano pot still", "15 ml sherry pale cream", "22,5 ml purea di frutto della passione", "22,5 ml sciroppo di cannella", "22,5 ml succo di limone"], "pepe rosa appena schiacciato, ombrellino di carta", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in uno snifter su ghiaccio tritato. Infine, decorate con pepe rosa appena schiacciato e servite con un ombrellino di carta."], ["Tequila infusa all’habanero", "Private del picciolo e tagliate a rondelle sottili 4 peperoncini habanero, tenendo presente che la fonte principale di piccantezza sono i semi: teneteli o eliminateli secondo i vostri gusti. Unite gli habanero a 1 litro di tequila blanco in un contenitore di vetro o non poroso e non reattivo. Agitate delicatamente per mescolare e lasciate in infusione a temperatura ambiente fino a 15 minuti, assaggiando dopo 10 minuti per controllare il livello di piccantezza. Filtrate ed eliminate i solidi, soprattutto i semi (quelli rimasti continuano a rilasciare piccantezza). Rimettete la tequila infusa nella bottiglia originale (meglio se con un’etichetta, per non dimenticare che è infusa) o conservate in un contenitore ermetico."], ["Nota", "Ricetta di Karen Fu (The Studio at Freehand, New York), ispirata al Saturn."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Rum Firewalker", "Tumbler alto", "Shake", "", ["90 ml rum giamaicano overproof", "30 ml Campari", "30 ml sciroppo di cannella", "30 ml succo di lime"], "rametto di menta, fiore edibile", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio per raffreddare e versate in un tumbler alto su ghiaccio a cubetti. Infine, decorate con un rametto di menta e un fiore edibile."], ["Nota", "Ricetta di Jason Alexander (Tacoma Cabana e Devil’s Reef, Tacoma), condivisa da Nick Feris, fondatore di The Rum Collective."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["The S.O.S. Mai Tai", "Tumbler alto", "Shake", "", ["45 ml rum giamaicano pot still", "15 ml rhum agricole blanc", "15 ml orange curaçao", "22,5 ml orzata", "22,5 ml succo di lime"], "guscio di lime fiammeggiato", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker e aggiungete una manciata di ghiaccio. Shakerate con vigore e versate tutto il contenuto in un tumbler alto, completando con ghiaccio tritato fresco. Infine, decorate con un guscio di lime fiammeggiato."], ["Nota", "Per un effetto scenografico si può spolverare cannella in polvere (da una saliera o un setaccio) sulla fiamma, creando scintille da falò che possono saltare fino a 45-60 cm sopra il drink. Attenzione all’ambiente circostante: legate i capelli lunghi, arrotolate le maniche e lavorate in un luogo ben ventilato con un estintore a portata di mano. Ricetta di Ean Bancroft (S.O.S. Tiki Bar, Atlanta)."], ["Orzata", "Sciroppo a base di mandorla, forma concentrata dell’horchata: aromi floreali e zuccheri leggermente caramellati, ottimo con i sapori terrosi del rum dei Caraibi. L’autore preferisce acquistarla (L’Orgeat, Small Hand Foods, Beachbum Berry); in alternativa vedi la ricetta di orzata alle noci macadamia del Mr. Bodi Hai."], ["Guscio di lime fiammeggiato", "Dopo aver spremuto mezzo lime, resta il guscio. Con un coltello affilato togliete la polpa dall’interno di un lime tagliato a metà, lasciando intatta la scorza, per ottenere una piccola ciotola. Imbevete una zolletta di zucchero con rum 151 proof, mettetela nel guscio, posizionate il guscio nel drink e aggiungete un altro goccio di rum. Poco prima di servire, accendete con cautela con un cannello da cucina o un lungo fiammifero (mai un accendino). Spolverando cannella in polvere sulla fiamma si creano scintille brevi ma scenografiche. Funziona meglio su drink serviti su ghiaccio tritato o come centrotavola di una Tiki bowl. Con ogni fiamma libera, soprattutto con alcolici ad alta gradazione, state molto attenti: lavorate in un ambiente ben ventilato lontano da materiali infiammabili, evitate abiti larghi, arrotolate le maniche e legate i capelli, tenete a portata di mano un estintore funzionante (e sappiate usarlo). Versate prima il rum, poi chiudete e allontanate la bottiglia prima di introdurre la fiamma: non provate mai ad accendere la decorazione mentre versate."]], "Tiki & Rum", 1],
["Planteur au Vanille", "Tumbler alto", "Blend", "", ["60 ml rhum agricole infuso alla vaniglia (sous vide)", "30 ml liquore alla banana", "15 ml sciroppo di cocco tostato", "30 ml purea di guava", "15 ml succo di lime"], "cannella grattugiata, chip di ananas disidratato", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con poco ghiaccio. Frullate alla massima velocità per 10-15 secondi (se preparate più porzioni, aggiungete circa 5 secondi per ogni porzione in più). Versate in un tumbler alto ghiacciato. Infine, decorate con cannella grattugiata e un chip di ananas disidratato."], ["Rhum agricole infuso alla vaniglia (sous vide)", "Unite 1 baccello di vaniglia aperto e 3-4 anici stellati interi con 1 litro di rhum agricole in un sacchetto sottovuoto per alimenti. Sigillate bene, eliminando più aria possibile. Mettete il sacchetto in una pentola grande, fissate a lato l’asta sous vide e riempite d’acqua finché sacchetto e asta sono completamente immersi, lasciando circa 5 cm sopra il livello dell’acqua. Seguendo le istruzioni dell’asta sous vide, impostate a 60 °C per 2 ore: per un sapore più marcato si può provare con tempi più lunghi. Togliete il sacchetto dal bagnomaria e lasciate raffreddare. Filtrate il rum infuso con una garza eliminando i solidi. Travasate in una bottiglia pulita ed ermetica e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Sciroppo di cocco tostato", "Tostate circa 45 g di cocco non zuccherato in una padella asciutta a fuoco medio-basso, finché è profumato e dorato. Unite il cocco tostato a 240 ml di acqua di cocco e circa 340 g di miele e seguite la ricetta dello sciroppo semplice, facendo sobbollire per circa 30 minuti. Lasciate raffreddare, filtrate ed eliminate i solidi. Con lo zucchero semolato al posto del miele si ottiene una versione più brillante e dolce. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Flight of the Albatross", "Tumbler alto", "Blend", "", ["60 ml acquavite infusa all’anice", "15 ml sciroppo di cannella", "15 ml horchata di riso rosso", "15 ml succo di lime"], "cannella grattugiata, scorza di lime grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con poco ghiaccio e frullate per 10 secondi. Versate in un tumbler alto e decorate con cannella grattugiata e scorza di lime appena grattugiata."], ["Nota", "Acquavite infusa all’anice: vedi la ricetta del Cicada. Horchata di riso rosso: vedi la ricetta dell’Headhunter."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Birdman", "Tumbler alto", "Blend", "", ["45 ml mezcal lavato all’olio di avocado", "30 ml Amaro di Angostura", "7,5 ml liquore al chile", "30 ml purea di papaya", "15 ml succo di lime"], "2 foglie di ananas", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con poco ghiaccio. Frullate alla massima velocità per 10-15 secondi. Versate in un tumbler alto ghiacciato e decorate con 2 foglie di ananas."], ["Mezcal lavato all’olio di avocado", "Unite 360 ml di olio di avocado (più della quantità tipica del fat-wash, per l’intensità dei sapori del mezcal) e 1 litro di mezcal in un contenitore di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 4-6 ore. Trasferite nel freezer per altre 8 ore o per tutta la notte, finché l’olio si solidifica. Togliete il contenitore dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui, poi filtrate il mezcal due volte con una garza prima di usarlo. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."]], "Tiki & Rum", 1],
["Eternal Mystery Blossom", "Hurricane", "Flash Blend (ghiaccio tritato)", "", ["30 ml pisco", "30 ml rum giamaicano overproof", "7,5 ml liquore allo yuzu", "15 ml purea di mango", "15 ml succo di lime"], "scorza di lime grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con poco ghiaccio tritato. Frullate alla massima velocità per 10 secondi e versate in un bicchiere hurricane ghiacciato. Infine, decorate con scorza di lime appena grattugiata."]], "Tiki & Rum", 1],
["Tamarindita", "Tumbler basso", "Flash Blend (ghiaccio tritato)", "", ["60 ml rum invecchiato", "15 ml Cynar", "30 ml purea di tamarindo", "30 ml latte di banana", "7,5 ml Fernet (top)"], "stecca di cannella grattugiata", [["Preparazione", "Mettete tutti gli ingredienti tranne il fernet in un frullatore con ghiaccio. Frullate per 15 secondi e filtrate in un tumbler basso su ghiaccio tritato. Completate con il fernet e decorate con cannella appena grattugiata."], ["Latte di banana", "Sbucciate 1 banana matura, tagliatela a pezzi e congelatela. Frullate la banana congelata con 240 ml di acqua, 2,5 ml di estratto di vaniglia, 5 ml di miele (o sciroppo dolcificante), 5 g di cacao in polvere, 1 g di cannella e 1 g di noce moscata appena grattugiata, alla massima velocità fino a ottenere una crema liscia, aggiungendo acqua se serve. Il latte di banana è meglio usarlo subito, ma si conserva in frigorifero fino a 2 giorni (può scurirsi un po’). Si può prolungare di un paio di giorni aggiungendo 30 ml di distillato ad alta gradazione, per esempio un rum invecchiato da 75 °."]], "Tiki & Rum", 1],
["Bamboo Trail", "Bicchiere di bambù", "Flash Blend (ghiaccio tritato)", "", ["60 ml shochu", "30 ml sherry amontillado", "30 ml Calpico concentrato", "15 ml orzata", "15 ml succo di frutto della passione", "22,5 ml succo di lime"], "scorza di lime grattugiata, fiore edibile", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio tritato. Frullate per 10 secondi e versate in un bicchiere di bambù ghiacciato. Decorate con scorza di lime appena grattugiata e un fiore edibile."], ["Nota", "Calpico: bevanda giapponese a base di latte, qui usata come concentrato."], ["Orzata", "Sciroppo a base di mandorla, forma concentrata dell’horchata: aromi floreali e zuccheri leggermente caramellati, ottimo con i sapori terrosi del rum dei Caraibi. L’autore preferisce acquistarla (L’Orgeat, Small Hand Foods, Beachbum Berry); in alternativa vedi la ricetta di orzata alle noci macadamia del Mr. Bodi Hai."]], "Tiki & Rum", 1],
["Isla de Botanica", "Coppetta", "Flash Blend (ghiaccio tritato)", "", ["60 ml cachaça lavata all’olio di avocado", "22,5 ml sciroppo di frutto della passione e miele", "15 ml purea di mango", "22,5 ml succo di lime"], "fiore edibile", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con pochissimo ghiaccio e frullate per 15 secondi. Versate in una coppetta ghiacciata e decorate con un fiore edibile."], ["Cachaça lavata all’olio di avocado", "Unite 180 ml di olio di avocado e 750 ml di cachaça in un contenitore di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per altre 8 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui, poi filtrate due volte con una garza prima di usare. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Sciroppo di frutto della passione e miele", "Preparate lo sciroppo di miele 1:1 sostituendo l’acqua con un uguale volume di purea di frutto della passione scongelata. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Shochulada", "Snifter", "Blend (ghiaccio tritato)", "", ["60 ml shochu lavato all’olio di cocco", "30 ml Don’s Mix", "15 ml falernum", "15 ml succo di litchi", "22,5 ml succo di lime"], "scorza di lime grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio tritato e frullate per 10 secondi. Versate in uno snifter ghiacciato e decorate con scorza di lime appena grattugiata."], ["Shochu lavato all’olio di cocco", "Unite 180 ml di olio di cocco non raffinato (necessario per l’effetto desiderato: quello raffinato è inodore e insapore) e 700 ml di shochu in un contenitore con coperchio, agitando per mescolare, in un contenitore di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 4-6 ore. Trasferite nel freezer per almeno 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui, poi filtrate due volte con una garza prima di usare. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole. Si conserva a tempo indefinito in un contenitore ermetico in frigorifero (o freezer)."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["Encantamento", "Tumbler basso", "Flash Blend (ghiaccio tritato)", "", ["60 ml tequila lavata all’olio di avocado", "15 ml sciroppo di cocco tostato", "15 ml sciroppo di cannella", "30 ml succo di guanabana (soursop)", "22,5 ml succo di lime"], "foglia di banano, rondella di arancia rossa disidratata, scorza di lime grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio leggero e frullate per 15 secondi. Versate in un tumbler basso ghiacciato foderato con una foglia di banano. Decorate con una rondella di arancia rossa disidratata e scorza di lime appena grattugiata."], ["Tequila lavata all’olio di avocado", "Unite 180 ml di olio di avocado e 750 ml di tequila reposado in un contenitore di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per altre 8 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui, poi filtrate due volte con una garza prima di usare. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Sciroppo di cocco tostato", "Tostate circa 45 g di cocco non zuccherato in una padella asciutta a fuoco medio-basso, finché è profumato e dorato. Unite il cocco tostato a 240 ml di acqua di cocco e circa 340 g di miele e seguite la ricetta dello sciroppo semplice, facendo sobbollire per circa 30 minuti. Lasciate raffreddare, filtrate ed eliminate i solidi. Con lo zucchero semolato al posto del miele si ottiene una versione più brillante e dolce. Si conserva in frigorifero fino a 2 settimane."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Windfall", "Calice", "Blend", "", ["30 ml mezcal espadín", "45 ml sake nigori", "30 ml sciroppo di miele", "1 spicchio di pera arrostita", "7,5 ml succo di limone", "1 pizzico di scorza di limone", "7,5 ml Varnelli Amaro Sibilla (float)"], "rametto di rosmarino, fiore edibile", [["Preparazione", "In un frullatore mettete mezcal, sake, sciroppo di miele, pera, succo e scorza di limone. Aggiungete solo il ghiaccio tritato o a pezzetti necessario perché una piccola parte emerga sopra il livello del liquido. Frullate alla massima velocità per 15-20 secondi. Versate in un bicchiere ghiacciato e fate galleggiare l’amaro lungo il bordo. Decorate con un rametto di rosmarino fresco o un fiore edibile."], ["Pera arrostita", "Preriscaldate il forno a 175 °C e foderate una teglia con carta forno. Sbucciate e private del torsolo 1 pera matura (Anjou o Bosc, o la vostra preferita), poi dividetela a metà e tagliate ogni metà in 3 spicchi, per 6 totali. Mettete gli spicchi sulla teglia, conditeli con un filo di olio d’oliva e arrostite in forno per 45 minuti, finché sono teneri. Lasciate raffreddare."], ["Nota", "Ricetta di Karen Jarman (Brand Manager, Yola Mezcal, New York)."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["High Tide", "Tumbler alto", "Blend", "", ["60 ml bourbon whiskey infuso alle banana chip tostate", "7,5 ml allspice dram", "15 ml sciroppo speziato", "15 ml succo di ananas", "22,5 ml succo di lime"], "chip di ananas, spiedo di ananas, stecca di cannella grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio e frullate alla massima velocità per 15-20 secondi. Versate in un tumbler alto (Collins o Pearl Diver) ghiacciato e decorate con un chip di ananas, uno spiedo di ananas e cannella appena grattugiata."], ["Bourbon infuso alle banana chip tostate", "In un pentolino a fuoco medio-basso tostate 25 g di banana chip finché sono leggermente dorate e profumate. Unite le banana chip tostate a 475 ml di bourbon in un contenitore coperto di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 24 ore. Filtrate il bourbon ed eliminate le banana chip. Conservate in frigorifero fino a 4 settimane."], ["Sciroppo speziato", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate (possono sprigionare un po’ di fumo). Aggiungete la cannella e circa 1 g di chiodi di garofano interi allo sciroppo semplice quando arriva a sobbollire. Filtrate ed eliminate le spezie a sciroppo freddo. Senza chiodi si ottiene lo sciroppo di cannella. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Fog Cutter (Brother Cleve Remix, Tiki book)", "Tiki", "Shake", "", ["30 ml rum stile cubano", "30 ml rum giamaicano pot still", "30 ml pisco peruviano", "15 ml gin navy-strength", "7,5 ml crème de noyaux", "7,5 ml sciroppo di sesamo", "22,5 ml succo di calamansi (o yuzu)", "15 ml sherry oloroso dolce o Cynar (float)"], "rametto di menta, rondella di arancia rossa disidratata", [["Preparazione", "Shakerate con ghiaccio tutti gli ingredienti tranne lo sherry e versate in un grande snifter o in un Tiki mug. Fate galleggiare lo sherry East India Solera (o il Cynar 70) in superficie. Decorate con menta fresca e una rondella di arancia rossa disidratata."], ["Sciroppo di sesamo", "Preriscaldate il forno a 175 °C. Distribuite su una teglia circa 300 g di semi di sesamo crudi e tostateli sulla griglia centrale finché sono leggermente dorati e profumati, 8-10 minuti. Unite i semi tostati a 475 ml di acqua in un pentolino, portate a bollore a fuoco medio-alto e fate sobbollire per 15 minuti, fino a ridurre a circa 240 ml. Filtrate con un colino a maglia fine, eliminate i solidi e rimettete il liquido nel pentolino. Aggiungete circa 200 g di zucchero e mescolate finché si scioglie. Travasate in un contenitore ermetico e conservate in frigorifero fino a 3 settimane."], ["Nota", "Rivisitazione del Fog Cutter di Brother Cleve: rum giamaicano più corposo con il rum cubano, pisco Quebranta o Italia, sherry East India Solera o Cynar 70 in float."]], "Tiki & Rum", 1],
["Buccaneer’s Bounty", "Tiki bowl", "Stir", "", ["250 ml rum speziato della Guyana", "125 ml rye whiskey", "100 ml sciroppo di cannella", "125 ml succo di guanabana (soursop)", "125 ml succo di lime", "50 ml angostura"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 4-6 persone. Mescolate tutti gli ingredienti in un contenitore non reattivo. Versate su ghiaccio in una Tiki bowl o in un recipiente da portata a scelta. Servite con cannucce e decorate con rondelle di agrumi e fiori edibili."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Paraiso Eterno", "Tiki bowl", "Stir", "", ["250 ml rum bianco invecchiato infuso all’anice", "50 ml liquore al chile verde", "125 ml sciroppo di vaniglia", "100 ml acqua di cocco", "180 ml succo di lime"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 4-6 persone. Mescolate tutti gli ingredienti in un contenitore non reattivo. Versate su ghiaccio in una Tiki bowl o in un recipiente da portata a scelta. Servite con cannucce e decorate con rondelle di agrumi e fiori edibili."], ["Rum bianco invecchiato infuso all’anice", "Unite 30 ml di semi di anice interi con 1 litro di rum bianco invecchiato in un contenitore di vetro o non poroso e non reattivo. Mescolate delicatamente e lasciate in infusione a temperatura ambiente per 24 ore. Filtrate (fine strain) ed eliminate i semi. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Sciroppo di vaniglia", "Due modi: aggiungete fino a 15 ml di estratto di vaniglia all’acqua della ricetta dello sciroppo Demerara; oppure, per lo stile autentico dei classici Tiki bar, versate lo sciroppo semplice caldo su 1 baccello di vaniglia aperto per il lungo in un barattolo o una bottiglia di vetro e lasciate raffreddare. Con l’estratto si conserva in frigorifero fino a 2 settimane, con il baccello 1 settimana."]], "Tiki & Rum", 1],
["Old Rogue", "Tiki bowl", "Stir", "", ["250 ml rum giamaicano pot still", "100 ml Cognac", "50 ml Batavia arrack", "50 ml orange curaçao", "125 ml sciroppo di tè verde", "50 ml succo di ananas", "100 ml succo di limone"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 4-6 persone. Mescolate tutti gli ingredienti in un contenitore non reattivo. Versate su ghiaccio in una Tiki bowl o in un recipiente da portata a scelta. Servite con cannucce e decorate con rondelle di agrumi e fiori edibili."], ["Sciroppo di tè", "Seguite la ricetta dello sciroppo semplice usando al posto dell’acqua un tè o una tisana preparati freschi, forti ma non tannici né amari: tè nero deciso come l’Earl Grey, tè verde erboso, miscele floreali come ibisco e rooibos, o erbe aromatiche come citronella e menta piperita. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Captain’s Quarters", "Tiki bowl", "Stir", "", ["250 ml rum stile navy", "100 ml rhum agricole ambré", "125 ml sciroppo Demerara", "125 ml succo di lime", "50 ml tè Ceylon preparato"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 4-6 persone. Mescolate tutti gli ingredienti in un contenitore non reattivo. Versate su ghiaccio in una Tiki bowl o in un recipiente da portata a scelta. Servite con cannucce e decorate con rondelle di agrumi e fiori edibili."], ["Navy Rum Blend", "Miscela ispirata ai rum degli imbottigliatori: 5 parti di rum Demerara, 1 parte di rhum agricole ambré e 1 parte di rum giamaicano overproof. Aromi pungenti di frutta matura e sapori corposi, ideale per punch e drink mixati morbidi."], ["Sciroppo Demerara", "Stessa preparazione dello sciroppo semplice con zucchero Demerara. Sapore terroso e corpo più vivace, ideale per drink con base di distillati scuri; i granelli dorati sono più grandi dello zucchero semolato, quindi lo sciroppo è un po’ meno dolce dello sciroppo semplice. Si conserva in frigorifero 3-4 settimane."]], "Tiki & Rum", 1],
["Archipelago", "Tiki bowl", "Stir", "", ["250 ml arrack di Batavia invecchiato", "100 ml calvados", "50 ml liquore di pera", "125 ml sciroppo di zenzero", "100 ml succo di limone"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 4-6 persone. Mescolate tutti gli ingredienti in un contenitore non reattivo. Versate su ghiaccio in una Tiki bowl o in un recipiente da portata a scelta. Servite con cannucce e decorate con rondelle di agrumi e fiori edibili."], ["Nota", "Molte Tiki bowl hanno una mini-ciotola per una decorazione fiammeggiante, lontana dal corpo del drink: riempitela con un goccio di rum 151 proof o una zolletta di zucchero imbevuta e accendete con cautela prima di servire. Spegnete sempre la fiamma prima di bere e prendete tutte le precauzioni (vedi pag. 182)."], ["Sciroppo di zenzero", "Seguite la ricetta dello sciroppo semplice e, quando arriva a sobbollire, aggiungete fino a 115 g di zenzero fresco sbucciato e tagliato a rondelle sottili. Lasciate in infusione per 45 minuti prima di filtrare ed eliminare i solidi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Koopman", "Punch bowl", "Stir", "", ["500 ml gin invecchiato in botte", "250 ml Batavia arrack", "250 ml sciroppo di citronella", "500 ml succo di mandarino", "250 ml succo di lime", "250 ml tè Earl Grey preparato"], "spicchi di agrumi, rondelle di agrumi, noce moscata grattugiata", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con spicchi e rondelle di agrumi e noce moscata appena grattugiata."], ["Sciroppo di tè", "Seguite la ricetta dello sciroppo semplice usando al posto dell’acqua un tè o una tisana preparati freschi, forti ma non tannici né amari: tè nero deciso come l’Earl Grey, tè verde erboso, miscele floreali come ibisco e rooibos, o erbe aromatiche come citronella e menta piperita. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Antilles Jewel", "Punch bowl", "Stir", "", ["500 ml rum invecchiato di Barbados", "250 ml rum demerara invecchiato", "200 ml liquore alla banana", "100 ml crème de cacao bianco", "250 ml acqua di cocco", "350 ml succo di lime"], "rondelle di agrumi, fiori edibili", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con rondelle di agrumi e fiori edibili."]], "Tiki & Rum", 1],
["Tradewinds", "Punch bowl", "Stir", "", ["500 ml rum giamaicano pot still", "250 ml rum invecchiato di Barbados", "250 ml liquore all’arancia", "200 ml succo di limone", "100 ml succo di arancia rossa", "50 ml angostura"], "rondelle di arancia rossa disidratate", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con rondelle di arancia rossa disidratate."], ["Nota", "Se è difficile trovare il succo fresco di arancia rossa, va bene la purea Perfect Puree of Napa Valley."]], "Tiki & Rum", 1],
["Port of Call", "Punch bowl", "Stir", "", ["300 ml rum navy-strength", "100 ml Batavia arrack", "100 ml rum giamaicano overproof", "75 ml allspice dram", "200 ml succo di mandarino", "300 ml succo di lime", "100 ml angostura"], "scorza di lime grattugiata, noce moscata grattugiata", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con scorza di lime e noce moscata appena grattugiate."]], "Tiki & Rum", 1],
["Rios del Miel", "Punch bowl", "Stir", "", ["12 limoni", "1 ananas maturo, sbucciato, privato del torsolo e tagliato a cubetti da 2,5 cm", "20 semi di coriandolo interi", "3 chiodi di garofano interi", "1 stecca di cannella", "1 anice stellato", "400 g zucchero", "250 ml tè Sencha preparato caldo", "240 ml acqua bollente", "750 ml cachaça non invecchiata", "250 ml pisco", "250 ml falernum", "125 ml liquore allo yuzu", "1 litro latte intero"], "fiori edibili, rondelle di agrumi", [["Preparazione", "Per 8-10 persone. Con un pelapatate togliete la scorza dai limoni. Spremete i limoni sbucciati e conservate il succo, eliminando i solidi. In una ciotola grande, di vetro o non porosa e non reattiva, unite le scorze di limone, l’ananas, le spezie e lo zucchero e pestate (muddle). Versate il tè verde preparato e mescolate. Aggiungete l’acqua bollente e coprite subito. Lasciate riposare una notte, poi filtrate in un contenitore pulito eliminando i solidi. Aggiungete cachaça, pisco, falernum e liquore allo yuzu. Portate il latte a bollore. Aggiungete il latte caldo e il succo di limone conservato alla miscela di rum filtrata: il latte cagliando farà coagulare i solidi. Filtrate il liquido poco alla volta con un colino a maglia fine o un chinois foderato con garza, sostituendo la garza se si ricopre di troppi solidi del latte. Versate in un contenitore pulito, coprite e rimettete in frigorifero per una notte, perché i residui del latte si depositino. Filtrate di nuovo con colino o garza, poi travasate il punch in una bottiglia pulita e conservate in frigorifero fino a 3 mesi. Mescolate prima di servire; se usate una punch bowl, versate su un grosso blocco di ghiaccio. Decorate con fiori edibili e rondelle di agrumi."], ["Nota", "Milk punch (punch chiarificato al latte): il latte rimuove i solidi lasciando siero e grassi, che danno una consistenza setosa."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["No Woman No Cry", "Punch bowl", "Stir", "", ["500 ml rum giamaicano pot still", "250 ml rum blackstrap", "250 ml sciroppo di ibisco", "100 ml succo di ananas", "200 ml succo di lime", "100 ml tè Ceylon preparato", "100 ml angostura", "100 ml Peychaud’s bitters"], "rondelle di agrumi freschi e disidratati", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con rondelle di agrumi freschi e disidratati."], ["Sciroppo di tè", "Seguite la ricetta dello sciroppo semplice usando al posto dell’acqua un tè o una tisana preparati freschi, forti ma non tannici né amari: tè nero deciso come l’Earl Grey, tè verde erboso, miscele floreali come ibisco e rooibos, o erbe aromatiche come citronella e menta piperita. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Royal Dock Cooler", "Punch bowl", "Stir", "", ["750 ml rum giamaicano pot still", "250 ml sciroppo di ananas", "200 ml succo di pompelmo", "50 ml tè Earl Grey preparato"], "rondelle di lime", [["Preparazione", "Per 8-10 persone. Mescolate tutti gli ingredienti. Conservate almeno 4 ore o fino a una notte in un contenitore coperto in frigorifero. Mescolate prima di servire. Se usate una punch bowl, versate su un grosso blocco di ghiaccio per rallentare la diluizione. Decorate con rondelle di lime fresco."], ["Nota", "Variante leggera del Daiquiri, con tè nero e agrumi essiccati."], ["Sciroppo di ananas", "Preparate una dose doppia di sciroppo semplice (400 g di zucchero e 480 ml di acqua). Tagliate a metà e poi ancora a metà per il lungo 1 ananas maturo; sbucciate, togliete il torsolo e tagliate a cubetti un quarto (circa 300 g). In un contenitore ermetico di vetro o non poroso e non reattivo unite lo sciroppo e l’ananas, coprite e lasciate in infusione in frigorifero per 48 ore, poi filtrate ed eliminate i solidi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],

, [], "Schede singole", 1]], ["Versione Spring List serale 2025 (con Ancho Reyes)", ["Spicy Fifty", "Coppetta", "Shake", "180 ml", ["50 ml vodka alla vaniglia", "15 ml liquore ai fiori di sambuco", "15 ml succo di lime", "10 ml honey mix", "10 ml Ancho Reyes"], "1 peperoncino", [["Vodka alla vaniglia", "Tagliare per lungo un baccello di vaniglia e metterlo in infusione in un litro di vodka per almeno 48 ore, o per 2 ore in sous vide a 62 °C."]], "Spring List serale 2025", 1]]], "Sidecar|IBA": [["Versione Schede singole", ["Sidecar", "Coppetta", "Shake", "180 ml", ["50 ml cognac", "20 ml triple sec", "20 ml succo di limone"], "", [], "Schede singole", 1]]], "Mary Pickford|IBA": [["Versione Schede singole", ["Mary Pickford", "Coppetta", "Shake", "180 ml", ["45 ml rum", "30 ml succo di ananas", "5 ml Luxardo maraschino", "15 ml granatina"], "", [], "Schede singole", 1]]], "Ti’ Punch|Serata Sudamericana": [["Versione Altri classici", ["Ti’ Punch", "Tumbler basso", "Build", "270 ml", ["60 ml rhum agricolo bianco (55% vol.)", "10 ml zucchero integrale", "1 spicchio di lime"], "", [["Preparazione", "Mettete nel bicchiere lo zucchero, spremete lo spicchio di lime e lasciatelo cadere dentro. Col bar spoon cercate di sciogliere lo zucchero più che potete e aggiungete il Rhum. Potete servire il drink con un cucchiaino, che serve per sciogliere l’eventuale residuo di zucchero."], ["Nota", "Utilizzate Rhum con almeno 55% vol. Si può aggiungere più o meno zucchero, più o meno lime, del ghiaccio e usare lo zucchero che si preferisce. In alcune versioni si usa, al posto dello spicchio di lime, un disco (o più) di scorza della misura di una moneta da cui si sprizzano gli olii essenziali e che si lascia cadere nel bicchiere. Esistono anche versioni alla frutta, con pezzetti di frutta tropicale da schiacciare nel drink."]], "Altri classici", 1]], ["Versione Tiki & Rum", ["Ti’ Punch", "Tumbler basso", "Build", "350 ml", ["1 lime (solo disco di scorza)", "5 ml sciroppo di canna o sciroppo semplice", "60 ml rhum agricole blanc, preferibilmente da 50° o più"], "", [["Preparazione", "Con un coltello da pelare affilato ricavate dal lime un disco di scorza grande circa quanto un dollaro d’argento (circa 4 cm), prendendo il meno possibile di parte bianca e polpa. In un tumbler basso pestate il disco di lime con lo sciroppo di canna o semplice, poi completate con il rum. Mescolate bene."], ["Nota", "Il drink nazionale della Martinica non ha una vera ricetta: si prepara e si gusta secondo il proprio gusto (detto locale: «Chacun prépare sa propre mort»). Tradizionalmente non si usa ghiaccio, nelle isole sarebbe un sacrilegio, ma se qualche cubetto lo rende più piacevole si può aggiungere. Con un rhum agricole ambré o vieux si ottiene un Ti’ Punch da fine serata (in Martinica si beve il blanc di pomeriggio e il vieux a fine serata). Sciroppo di canna (sirop de canne): vedi la preparazione sotto."], ["Sciroppo di canna", "Fatto con succo di canna fresco, mantiene parte del terroir vegetale della canna da zucchero; ha un sapore fresco e crudo. Si aggiungono a volte scorza d’arancia, stecche di cannella, baccelli di vaniglia, chiodi di garofano, bacche di pimento o alloro. Si conserva in frigorifero 3-4 settimane."]], "Tiki & Rum", 1]]], "Zombie|IBA": [["Versione Serata Sudamericana", ["Zombie", "", "", "", ["30 ml Wray & Nephew overproof rum", "45 ml dark rum", "30 ml rum", "30 ml succo di limone", "30 ml succo di lime", "30 ml estratto di ananas", "30 ml sciroppo di passion fruit", "10 ml sciroppo di zucchero grezzo", "1 dash Angostura bitters"], "1 ciuffo di menta", [], "Serata Sudamericana", 1]]], "Fernandito|IBA": [["Versione Serata Sudamericana", ["Fernandito", "Tumbler alto", "Build", "370 ml", ["50 ml Fernet Branca", "top coca cola"], "1 ciuffo di menta", [], "Serata Sudamericana", 1]]], "Bobby Burns|Serata Reddy": [["Versione Altri classici", ["Bobby Burns", "Coppetta", "Stir", "180 ml", ["50 ml Scotch whisky", "20 ml vermouth rosso dolce", "5 ml D.O.
