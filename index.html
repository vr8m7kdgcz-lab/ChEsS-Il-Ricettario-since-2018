<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f7f8f8;--ink:#1b1f22;--mute:#5d666b;--line:#d9dee0;--red:#c4221f;--chip:#e9eced;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--ink:#eceeed;--mute:#9aa4a8;--line:#2b3336;--red:#ff6f62;--chip:#222a2d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181a;--ink:#eceeed;--mute:#9aa4a8;--line:#2b3336;--red:#ff6f62;--chip:#222a2d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.cover{max-width:640px;margin:0 auto}.cover img{display:block;width:100%;height:auto;max-height:42vh;object-fit:cover;object-position:top}
.tabs{display:flex;gap:8px;margin:0 0 10px}.tabs button{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg,inherit);font:inherit;font-weight:600;cursor:pointer}.tabs button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.wrap{max-width:640px;margin:0 auto}
h1{margin:0 0 10px;font-size:30px;font-weight:800;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:15px;font-weight:400;color:var(--mute)}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer}
.groups{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.groups button{flex:none;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}.groups button[aria-pressed="true"]{border-color:var(--red);color:var(--red);font-weight:600}.groups button[aria-expanded="true"]{background:var(--chip)}.groups .clr{border-style:dashed;color:var(--mute)}
.chips.act{padding:4px 0 0}.chips.act:empty{display:none}.chips.act .sl{margin-right:2px}.chips.act button{font-size:13px;padding:3px 10px;background:var(--red);border-color:var(--red);color:#fff}.chips.sub{padding:2px 0 2px 14px}.chips.sub:empty{display:none}.chips .sl{flex:none;align-self:center;font-size:13px;color:var(--mute)}.chips button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
main{padding:6px 16px 40px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
summary::-webkit-details-marker{display:none}
.n{display:block;font-size:21px;font-weight:600;color:var(--red)}.src{font-size:13px;color:var(--mute)}.hd{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}.hdl{flex:1;min-width:0}.ph{flex:none;width:84px;height:84px;object-fit:cover;border-radius:8px}.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px;font-size:14px;line-height:1.3}.spec b,.tn b{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);font-weight:600}.spec b{display:block}.tn{margin:0 0 8px;font-size:15px}.tn b{margin-right:6px}.est{color:var(--mute);font-size:12px}.var{font-weight:400;font-size:17px;color:var(--ink)}
.m{font-size:14px;color:var(--mute);text-align:right}
.body{padding:0 0 18px}.ver{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:0 12px}.ver summary{padding:10px 0}.ver .n{font-size:16px}
ul{list-style:none;margin:0;padding:0}
li{padding:5px 0;border-bottom:1px dashed var(--line)}
li b{display:inline-block;min-width:64px;font-weight:600}
.d{margin:12px 0 0}
.d b,.p h3{font-weight:600}
.p{margin-top:14px;padding-left:12px;border-left:3px solid var(--red)}
.p h3{margin:0 0 4px;font-size:16px}
.p p{margin:0;color:var(--mute);max-width:60ch}
.empty{padding:40px 0;color:var(--mute);text-align:center}
#bk{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:50;padding:10px 18px;border-radius:999px;border:1px solid currentColor;background:var(--bg,#fff);color:inherit;font:inherit;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:pointer}a.pl{color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}a.pl:hover{text-decoration-style:solid}</style>
</head>

["Sazerac al Rye", "Tumbler basso", "Stir", "350 ml", ["50 ml rye whiskey", "10 ml assenzio", "1 zolletta di zucchero", "2 dashes Peychaud’s Bitters"], "twist di limone", [["Variante", "Variante non IBA a base Rye Whiskey (la versione standard). Dosi ricavate dalla ricetta del Sazerac."], ["Preparazione", "Prendete un tovagliolino, mettetevi sopra la zolletta, appoggiate tutto sul mixing glass ghiacciato e saturatela con il Peychaud’s Bitters. Lasciate ora cadere la zolletta nel mixing glass freddo, versate il Rye Whiskey e l’assenzio, cercate di sciogliere lo zucchero col bar spoon, mettete il ghiaccio a cubetti e stirrate. Filtrate nel bicchiere senza ghiaccio, sprizzate il twist di limone ed eliminatelo."]], "IBA varianti", 1],
["Sazerac Half and Half", "Tumbler basso", "Stir", "350 ml", ["25 ml rye whiskey", "25 ml cognac", "10 ml assenzio", "1 zolletta di zucchero", "2 dashes Peychaud’s Bitters"], "twist di limone", [["Variante", "Variante non IBA con metà Rye e metà Cognac. Dosi ricavate dalla ricetta del Sazerac."], ["Preparazione", "Prendete un tovagliolino, mettetevi sopra la zolletta, appoggiate tutto sul mixing glass ghiacciato e saturatela con il Peychaud’s Bitters. Lasciate ora cadere la zolletta nel mixing glass freddo, versate il Rye Whiskey e il Cognac e l’assenzio, cercate di sciogliere lo zucchero col bar spoon, mettete il ghiaccio a cubetti e stirrate. Filtrate nel bicchiere senza ghiaccio, sprizzate il twist di limone ed eliminatelo."]], "IBA varianti", 1],
["Old Cuban con Chartreuse", "Coppetta", "Shake", "180 ml", ["6-8 foglie di menta", "45 ml rum invecchiato", "22,5 ml succo di lime fresco", "30 ml sciroppo di zucchero", "2 gocce Angostura Bitters", "5 ml Chartreuse gialla o verde", "60 ml Champagne o prosecco"], "menta", [["Variante", "Variante non IBA: con 5 ml di Chartreuse gialla o verde si ottiene una direzione erbacea."], ["Preparazione", "Shakerate tutti gli ingredienti tranne il vino e filtrate in una coppetta ghiacciata. Aggiungete lo Champagne ben freddo e un ciuffo di menta come decorazione."]], "IBA varianti", 1],
["Kamikaze", "Coppetta", "Shake", "180 ml", ["50 ml vodka", "20 ml triple sec", "20 ml succo di limone fresco"], "", [["Variante", "Non IBA, a base Vodka: stessa struttura del Sidecar (distillato, triple sec, limone). Dosi ricavate dalla ricetta del Sidecar."], ["Preparazione", "Shakerate tutti gli ingredienti e filtrate in una coppetta ghiacciata."]], "IBA varianti", 1],
["Oaxaca Old Fashioned", "Tumbler basso", "Stir", "350 ml", ["40 ml tequila reposado", "20 ml mezcal", "20 ml sciroppo d’agave", "2 dashes Bitters"], "twist di arancia", [["Variante", "Classico contemporaneo non IBA."], ["Preparazione", "Versate tutti gli ingredienti in un mixing glass ben freddo, stirrate con ghiaccio a cubetti e filtrate nel bicchiere freddo pieno di ghiaccio. Infine, sprizzate il twist di arancia."]], "IBA varianti", 1],
["Cuba Old Fashioned", "Tumbler basso", "Stir", "350 ml", ["45 ml rum cubano invecchiato", "1 zolletta di zucchero", "qualche goccia di Angostura Bitters", "un goccio di acqua minerale"], "twist di arancia, ciliegina", [["Variante", "Non IBA, a base Rum cubano invecchiato. Dosi ricavate dalla ricetta dell’Old Fashioned."], ["Preparazione", "Prendete un tovagliolino, mettetevi sopra la zolletta, appoggiate tutto sul mixing glass ghiacciato e saturatela con l’Angostura. Lasciate ora cadere la zolletta nel mixing glass e mettete l’acqua naturale che servirà solo a sciogliere la zolletta evitando uno strato di zucchero sul fondo aiutandovi col bar spoon. Versate ora il Rum, l’Angostura, mettete il ghiaccio a cubetti e stirrate. Filtrate nel bicchiere freddo pieno di ghiaccio e sprizzate il twist di arancia. Infine, decorate con la ciliegina."]], "IBA varianti", 1],

["Caipirinha", "Tumbler basso", "Build (ghiaccio tritato)", "350 ml", ["60 ml cachaça", "1 lime a spicchi", "10 ml zucchero di canna bianco"], "", [["Preparazione", "Lavate bene il lime. Con un coltello a lama seghettata tagliatene le estremità, poi dividetelo in due pezzi per la parte lunga ed eliminate con un taglietto a V la parte bianca centrale (che rischia di portare un sapore amaro). Tagliate ogni metà lime in 4-6 pezzettini, metteteli insieme allo zucchero nel bicchiere di servizio ben freddo e pestate tutto con un muddler, cercando di fare uscire tutto il succo e gli olii essenziali della buccia. Sciogliete lo zucchero col bar spoon e solo ora aggiungete la Cachaça. È importante aggiungere lo spirito prima del ghiaccio e non dopo, perché è in grado di catturare meglio gli olii essenziali della buccia. Aggiungete ghiaccio tritato, date una leggera shakerata direttamente nel bicchiere con un mezzo Boston e il drink è pronto. Se necessario aggiungere in cima altro ghiaccio tritato."], ["Nota", "Per ottenere una Caipirinha fruttata aggiungete 30 ml di purea di frutta a piacere (fragola, lampone, passion fruit, mango)."]], "IBA", 1, "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCABUAFQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBA ["Vodka Martini", "Coppetta", "Stir", "110 ml", ["60 ml vodka", "10 ml vermouth dry"], "twist di limone, oliva verde (opzionale)", [["Variante", "Non IBA, a base Vodka. Dosi ricavate dalla ricetta del Dry Martini."], ["Preparazione", "Versate tutti gli ingredienti in un mixing glass freddo, stirrate con ghiaccio a cubetti e filtrate in una coppetta ghiacciata. Infine, sprizzate un leggero twist di limone (se richiesto) e servite con un’ottima oliva verde."]], "IBA varianti", 1],
["Gibson", "Coppetta", "Stir", "110 ml", ["60 ml gin", "10 ml vermouth dry", "1-2 cipolline sotto aceto"], "", [["Variante", "Non IBA: in finale si mettono 1-2 cipolline sotto aceto. Dosi ricavate dalla ricetta del Dry Martini."], ["Preparazione", "Versate tutti gli ingredienti in un mixing glass freddo, stirrate con ghiaccio a cubetti e filtrate in una coppetta ghiacciata. Infine, aggiungete le cipolline sotto aceto."]], "IBA varianti", 1],
["Dirty Martini", "Coppetta", "Stir", "110 ml", ["60 ml vodka", "10 ml vermouth dry", "qualche goccia di salamoia delle olive"], "oliva verde", [["Variante", "Ex IBA, a base Vodka e sporcato da qualche goccia di salamoia delle olive. Dosi ricavate dalla ricetta del Dry Martini."], ["Preparazione", "Versate tutti gli ingredienti in un mixing glass freddo, stirrate con ghiaccio a cubetti e filtrate in una coppetta ghiacciata. Infine, servite con un’oliva verde."]], "IBA varianti", 1],
["Corpse Reviver N.Blu", "Coppetta", "Shake", "180 ml", ["30 ml gin", "30 ml Blu Curaçao", "30 ml Lillet Blanc", "30 ml succo di limone fresco", "qualche goccia di assenzio"], "twist di arancia", [["Variante", "Non IBA: il triple sec è sostituito dal Blu Curaçao (creata da Jacob Briars). Dosi ricavate dalla ricetta del Corpse Reviver #2."], ["Preparazione", "Shakerate tutti gli ingredienti e filtrate in una coppetta ghiacciata. Infine, sprizzate il twist di arancia."]], "IBA varianti", 1],
["Clover Leaf", "Coppetta", "Shake", "180 ml", ["45 ml gin", "15 ml sciroppo di lamponi", "15 ml succo di limone fresco", "10 ml albume pastorizzato", "qualche foglia di menta"], "lamponi freschi", [["Variante", "Non IBA: prevede l’aggiunta di qualche foglia di menta. Dosi ricavate dalla ricetta del Clover Club."], ["Preparazione", "Versate tutti gli ingredienti in un Boston. Dopo avere effettuato una Dry Shake o montato gli ingredienti con un aerolatte, shakerate con ghiaccio e filtrate in una coppetta ghiacciata. Infine, decorate con dei lamponi freschi."]], "IBA varianti", 1],
["Prince of Wales Cocktail", "Flûte", "Build", "150 ml", ["90 ml Champagne", "10 ml cognac", "2 gocce Angostura Bitters", "1 zolletta di zucchero", "5-10 ml Grand Marnier"], "twist di arancia, ciliegina", [["Variante", "Non IBA: contiene 5-10 ml di Grand Marnier, più simile alla versione opzionale della ricetta IBA del Champagne Cocktail."], ["Preparazione", "Prendete un tovagliolino, mettetevi sopra la zolletta e saturatela con l’Angostura Bitters. Nella flûte ghiacciata, versate lo Champagne, il Cognac e la zolletta di zucchero. Seguendo questo ordine, il vino non perderà le bolle. Infine, sprizzate il twist di arancia e decorate con una ciliegina."]], "IBA varianti", 1],
["Canchanchara blend Bertazzoli", "Cocotta di terracotta", "Build (ghiaccio tritato)", "270 ml", ["25 ml ron cubano", "25 ml aguardiente", "10 ml rhum agricole bianco", "15 ml succo di lime fresco", "15 ml miele", "50 ml acqua"], "spicchio di lime", [["Variante", "Blend consigliato da Jimmy Bertazzoli al bar “Aguardiente”. Dosi dalle note della Canchanchara."], ["Preparazione", "Nel bicchiere di servizio, freddo, sciogliete il miele e il succo di lime nell’acqua, successivamente aggiungete l’Aguardiente e colmate con ghiaccio tritato. Miscelate bene dal basso verso l’alto con il bar spoon in modo da amalgamare bene gli ingredienti, aggiungete altro ghiaccio tritato perché sicuramente il livello scenderà e decorate con uno spicchio di lime."]], "IBA varianti", 1],

["Caipirissima", "Tumbler basso", "Build (ghiaccio tritato)", "350 ml", ["60 ml rum chiaro", "1 lime a spicchi", "10 ml zucchero di canna bianco"], "", [["Variante", "Variante indicata da IBA, a base Rum chiaro. Dosi ricavate dalla ricetta della Caipirinha."], ["Preparazione", "Lavate bene il lime. Con un coltello a lama seghettata tagliatene le estremità, poi dividetelo in due pezzi per la parte lunga ed eliminate con un taglietto a V la parte bianca centrale (che rischia di portare un sapore amaro). Tagliate ogni metà lime in 4-6 pezzettini, metteteli insieme allo zucchero nel bicchiere di servizio ben freddo e pestate tutto con un muddler, cercando di fare uscire tutto il succo e gli olii essenziali della buccia. Sciogliete lo zucchero col bar spoon e solo ora aggiungete il Rum. È importante aggiungere lo spirito prima del ghiaccio e non dopo, perché è in grado di catturare meglio gli olii essenziali della buccia. Aggiungete ghiaccio tritato, date una leggera shakerata direttamente nel bicchiere con un mezzo Boston e il drink è pronto. Se necessario aggiungere in cima altro ghiaccio tritato."]], "IBA varianti", 1],

["Bloody Mary", "Tumbler basso", "Stir", "350 ml", ["45 ml vodka", "90 ml succo di pomodoro", "15 ml succo di limone fresco", "2 gocce salsa Worcestershire", "tabasco a piacere", "sale e pepe a piacere"], "sedano e/o spicchio di limone", [["Preparazione", "Versate tutti gli ingredienti analcolici in un mixing glass freddo senza ghiaccio e miscelate. In questo modo le spezie si scioglieranno meglio che a contatto con l’alcol. Versate ora la Vodka, aggiungete il ghiaccio e miscelate (non troppo!) gli ingredienti. Filtrate in un tumbler basso e a seconda del risultato che volete ottenere, aggiungete ghiaccio o meno. Nel primo caso il drink potrebbe diluirsi spegnendo il sapore del pomodoro, nel secondo caso il drink avrà meno diluizione ma sentirete di più il suo sapore. Infine, decorate con sedano e/o uno spicchio di limone."], ["Nota", "Bloody Bull Shot: utilizza 30 ml di brodo e 30 ml di succo di pomodoro al posto dei 90 ml di succo di pomodoro, il resto della ricetta rimane invariato."]], "IBA", 1, "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCABUAFQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDuqyNa/wBfF/uH+da9ZGtKzSx7cfc7/WqAyXx1/Wsi+vzHc5jbHl/L7H61rsgU5yWb1P8AniuZvVmM7K9s0O45wMsD+NYVm1HQZMusvNKCqFGxjAbINaXnkIA/JPr2rFgt4 ["Alabazam", "Coppetta stretta", "Shake", "180 ml", ["52,5 ml brandy", "5 ml curaçao", "15 ml succo di limone fresco", "10 ml sciroppo di zucchero", "2 dashes Bitters"], "crusta di zucchero bianco e una lunga scorza d’arancia o limone lungo tutto il bordo interno del bicchiere", [["Variante", "Non IBA: come la Brandy Crusta ma senza liquore maraschino. Dosi ricavate dalla ricetta della Brandy Crusta."], ["Preparazione", "Bagnate il bordo di una coppetta ghiacciata con una fetta di limone e immergetela nello zucchero creando la crusta. Shakerate tutti gli ingredienti e filtrate nella coppetta. Infine, incastonate la scorza di limone."]], "IBA varianti", 1],
["Bramble al cassis", "Tumbler basso", "Shake", "350 ml", ["50 ml gin", "25 ml succo di limone fresco", "12,5 ml sciroppo di zucchero", "15 ml crème de cassis"], "fetta di limone e more", [["Variante", "Dolcezza e acidità diverse: crème de cassis al posto del liquore alle more. Dosi ricavate dalla ricetta del Bramble."], ["Preparazione", "Shakerate tutti gli ingredienti tranne la crème de cassis e filtrate in un tumbler basso freddo e colmo di ghiaccio tritato. Ora, versate delicatamente la crème de cassis in modo circolare sulla superficie del bicchiere in modo da ottenere un effetto sfumato. Infine, decorate con una fetta di limone e una o due more."]], "IBA varianti", 1],
["Red Snapper", "Tumbler basso", "Stir", "350 ml", ["45 ml gin", "90 ml succo di pomodoro", "15 ml succo di limone fresco", "2 gocce salsa Worcestershire", "tabasco a piacere", "sale e pepe a piacere"], "sedano e/o spicchio di limone", [["Variante", "Non IBA: a base Gin. Dosi ricavate dalla ricetta del Bloody Mary."], ["Preparazione", "Versate tutti gli ingredienti analcolici in un mixing glass freddo senza ghiaccio e miscelate. In questo modo le spezie si scioglieranno meglio che a contatto con l’alcol. Versate ora il Gin, aggiungete il ghiaccio e miscelate (non troppo!) gli ingredienti. Filtrate in un tumbler basso e a seconda del risultato che volete ottenere, aggiungete ghiaccio o meno. Nel primo caso il drink potrebbe diluirsi spegnendo il sapore del pomodoro, nel secondo caso il drink avrà meno diluizione ma sentirete di più il suo sapore. Infine, decorate con sedano e/o uno spicchio di limone."]], "IBA varianti", 1],
["Virgin Mary", "Tumbler basso", "Stir", "350 ml", ["120 ml succo di pomodoro", "15 ml succo di limone fresco", "2 gocce salsa Worcestershire", "tabasco a piacere", "sale e pepe a piacere"], "sedano e/o spicchio di limone", [["Variante", "Non IBA, variante analcolica (pomodoro aumentato a 120 ml). Dosi ricavate dalla ricetta del Bloody Mary."], ["Preparazione", "Versate tutti gli ingredienti in un mixing glass freddo senza ghiaccio e miscelate. Aggiungete il ghiaccio, miscelate (non troppo!) e filtrate in un tumbler basso. Infine, decorate con sedano e/o uno spicchio di limone."]], "IBA varianti", 0],
["Bull Shot", "Tumbler basso", "Stir", "350 ml", ["45 ml vodka", "90 ml brodo", "15 ml succo di limone fresco", "2 gocce salsa Worcestershire", "tabasco a piacere", "sale e pepe a piacere"], "sedano e/o spicchio di limone", [["Variante", "Non IBA: brodo al posto del succo di pomodoro. Dosi ricavate dalla ricetta del Bloody Mary."], ["Preparazione", "Versate tutti gli ingredienti analcolici in un mixing glass freddo senza ghiaccio e miscelate. In questo modo le spezie si scioglieranno meglio che a contatto con l’alcol. Versate ora la Vodka, aggiungete il ghiaccio e miscelate (non troppo!) gli ingredienti. Filtrate in un tumbler basso e a seconda del risultato che volete ottenere, aggiungete ghiaccio o meno. Nel primo caso il drink potrebbe diluirsi spegnendo il sapore del pomodoro, nel secondo caso il drink avrà meno diluizione ma sentirete di più il suo sapore. Infine, decorate con sedano e/o uno spicchio di limone."]], "IBA varianti", 1],
["White Russian", "Tumbler basso", "Stir", "270 ml", ["50 ml vodka", "20 ml liquore al caffè", "30 ml panna fresca"], "", [["Variante", "Variante indicata da IBA: 30 ml di panna fresca in superficie, leggermente addensata (shakerata a secco o con aerolatte). Dosi ricavate dalla ricetta del Black Russian."], ["Preparazione", "Versate vodka e liquore al caffè in un mixing glass ben freddo, stirrate con ghiaccio a cubetti e filtrate in un tumbler freddo pieno di ghiaccio. Infine, versate in superficie la panna fresca leggermente addensata."]], "IBA varianti", 1],
["Colorado Bulldog", "Tumbler basso", "Shake", "270 ml", ["50 ml vodka", "20 ml liquore al caffè", "20 ml panna fresca", "splash cola"], "", [["Variante", "Non IBA: si shakerano gli ingredienti insieme a 20 ml di panna fresca e si colma con una spruzzata di cola. Dosi ricavate dalla ricetta del Black Russian."], ["Preparazione", "Shakerate vodka, liquore al caffè e panna, filtrate in un tumbler basso con ghiaccio e colmate con una spruzzata di cola."]], "IBA varianti", 1],
["Puccini", "Flûte", "Build", "250 ml", ["100 ml prosecco", "50 ml spremuta di mandarino"], "", [["Variante", "Variante indicata nella lista IBA, a base di spremuta di mandarino. Dosi ricavate dalla ricetta del Bellini."], ["Preparazione", "Versate il succo e successivamente il Prosecco, in questo modo si formerà una schiuma morbida, in un mixing glass freddo o ancora meglio nel gallone. Mescolate delicatamente e versate nel bicchiere freddo ottenendo un piacevole cappello di schiuma in superficie."]], "IBA varianti", 1],

["Eagle’s Dream", "Coppetta", "Shake", "180 ml", ["45 ml gin", "15 ml succo di limone fresco", "10 ml crema di violetta", "15 ml sciroppo di zucchero", "5 ml albume pastorizzato (o 5 gocce di schiumogeno tipo Magic Foamer)"], "twist di limone", [["Variante", "Non IBA: Aviation senza liquore maraschino, con sciroppo di zucchero al posto del maraschino e 5 ml di albume pastorizzato (o 5 gocce di schiumogeno tipo Magic Foamer). Dosi ricavate dalla ricetta dell’Aviation."], ["Preparazione", "Versate tutti gli ingredienti in un Boston. Dopo avere effettuato una Dry Shake o montato gli ingredienti con un aerolatte, shakerate con ghiaccio e filtrate in una coppetta ghiacciata. Infine, sprizzate il twist di limone."]], "IBA varianti", 1],

["Banana Daiquiri", "Coppetta", "Blend", "220 ml", ["45 ml rum demerara", "20 ml succo di lime fresco", "20 ml sciroppo di zucchero", "½ banana matura", "½ cup di ghiaccio tritato"], "", [["Preparazione", "Frullate tutti gli ingredienti per 10-15 secondi o comunque fino ad ottenere una crema. Servite in una coppa ghiacciata."], ["Nota", "Il drink NON deve avere la consistenza di una granita ghiacciata (frozen) ma deve essere una crema: usate la quantità di ghiaccio indicata, che potete misurare con appositi cucchiai graduati in cup. Non chiamatelo Daiquiri frozen alla banana. Si può usare anche un rum chiaro in stile spagnolo per note meno dolci o un rum giamaicano per note dolci e secche allo stesso tempo. Sconsigliato il liquore di banana, per lasciare il sapore di banana il più naturale possibile."]], "Altri classici", 1, "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCABUAFQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDuqUdaSl71QHHzAvezgYAEjbmPRRk0sb28bDzY5JFK5DDj8hVe9uEj1KVdwG2RiVPGTnrTVkZiG+ZvrzXFUqO+h0Qgral55oon4hCrnIK4OaY967ZCKnXgiqzuZTgR4A6EmpokY8KpFYSnJmiikO8xG2h857sVBBqG4jwqsIwVI++ox/nvVv7JIMEjqfypbpFRAvyhRznnn8KqNRx3E4Jmp4d40of9dG/pWpWV4cYNpZK9POfH6Vq16EHeKZytWdgoooqhBSjqKSloA8s8VtJDqUkq/dZ25Hrk1m2utSx4+eup1ezjvpL ["Bombo", "Tumbler basso", "Stir", "", ["5 ml sciroppo di cannella", "60 ml rum navy style"], "noce moscata grattugiata", [["Preparazione", "In un tumbler basso freddo versate sciroppo e rum. Aggiungete un grosso cubo di ghiaccio e mescolate per raffreddare. Infine, decorate con noce moscata appena grattugiata."], ["Nota", "Antenato dell’Old Fashioned: le spezie fanno le veci dei bitter. Ideale un rum in stile Navy a 55% vol. o più; per un gusto più ricco usate un rum extra invecchiato o blackstrap."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Grog", "Tumbler basso", "Build", "", ["3-4 spicchi di lime", "22,5 ml sciroppo di zucchero", "60 ml rum navy style o demerara"], "bitter, spicchio di lime", [["Preparazione", "In un tumbler basso pestate gli spicchi di lime con lo sciroppo di zucchero. Aggiungete il rum e i cubetti di ghiaccio e mescolate per raffreddare. Infine, decorate con qualche goccia di bitter e uno spicchio di lime."]], "Tiki & Rum", 1],
["Floridita Daiquiri", "Coppetta", "Shake", "", ["22,5 ml succo di lime", "5 ml zucchero semolato", "60 ml rum bianco invecchiato"], "", [["Preparazione", "In uno shaker mescolate succo di lime e zucchero con il bar spoon. Aggiungete il rum e i cubetti di ghiaccio e shakerate con vigore: lo shaker deve essere ghiacciato. Filtrate (fine strain) in una coppetta ghiacciata."]], "Tiki & Rum", 1],
["Halekulani", "Coppetta", "Shake", "", ["45 ml bourbon whiskey overproof", "15 ml sciroppo demerara", "5 ml granatina", "15 ml succo di ananas", "15 ml succo di arancia", "15 ml succo di limone", "1 dash angostura"], "spicchio di ananas disidratato, rondella di agrume disidratata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate."], ["Sciroppo Demerara", "Stessa preparazione dello sciroppo semplice con zucchero Demerara. Sapore terroso e corpo più vivace, ideale per drink con base di distillati scuri; i granelli dorati sono più grandi dello zucchero semolato, quindi lo sciroppo è un po’ meno dolce dello sciroppo semplice. Si conserva in frigorifero 3-4 settimane."]], "Tiki & Rum", 1],
["Port au Prince", "Tumbler alto", "Shake (ghiaccio tritato)", "", ["60 ml clairin", "7,5 ml rum overproof o demerara", "22,5 ml falernum", "15 ml succo di ananas", "7,5 ml granatina", "22,5 ml succo di lime", "6 gocce tiki bitters"], "noce moscata grattugiata, scorza d’arancia", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate in un tumbler alto pieno di ghiaccio tritato. Infine, decorate con noce moscata appena grattugiata e una scorza d’arancia."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["Three Dots and a Dash", "Tumbler basso", "Shake (ghiaccio tritato)", "", ["45 ml rhum agricole ambrato 100 proof", "15 ml rum overproof Guyana", "7,5 ml allspice dram", "15 ml falernum", "15 ml sciroppo di miele", "15 ml succo di arancia", "15 ml succo di lime"], "3 foglie di ananas, 3 ciliegie al maraschino, spicchio di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio tritato e versate tutto il contenuto in un tumbler basso (double rocks), aggiungendo altro ghiaccio tritato. Infine, decorate con 3 foglie di ananas, 3 ciliegie al maraschino e uno spicchio di ananas su uno spiedino."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Royal Bermuda Yacht Club", "Coppetta", "Shake", "", ["60 ml rum invecchiato", "22,5 ml orange curaçao", "22,5 ml falernum", "22,5 ml succo di lime"], "rondella di lime", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (double strain) in una coppetta ghiacciata. Infine, decorate con una rondella di lime."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["Jungle Bird", "Tumbler alto", "Shake", "", ["60 ml rum giamaicano pot still", "22,5 ml Campari", "45 ml succo di ananas", "15 ml succo di lime"], "2 foglie di ananas, rondella di lime incisa", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler alto ghiacciato pieno di cubetti di ghiaccio. Infine, decorate con 2 foglie di ananas e una rondella di lime incisa."]], "Tiki & Rum", 1],
["Isle of Martinique", "Coppetta", "Shake", "", ["60 ml rhum agricole ambrato 100 proof", "15 ml sciroppo di miele", "7,5 ml orzata", "22,5 ml succo di lime"], "rondella di agrume disidratata, orchidea edibile", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate con una rondella di agrume disidratata o un’orchidea edibile."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."], ["Orzata", "Sciroppo a base di mandorla, forma concentrata dell’horchata: aromi floreali e zuccheri leggermente caramellati, ottimo con i sapori terrosi del rum dei Caraibi. L’autore preferisce acquistarla (L’Orgeat, Small Hand Foods, Beachbum Berry); in alternativa vedi la ricetta di orzata alle noci macadamia del Mr. Bodi Hai."]], "Tiki & Rum", 1],
["Navy Grog", "Tumbler basso", "Shake", "", ["30 ml rum bianco invecchiato", "30 ml rum pot still giamaicano", "30 ml rum invecchiato", "30 ml sciroppo di miele", "22,5 ml succo di lime", "22,5 ml succo di pompelmo bianco", "22,5 ml soda"], "guscio di lime, bandierina britannica", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler basso ghiacciato sopra un cono di ghiaccio. Infine, decorate con un guscio di lime e una piccola bandierina britannica."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Jet Pilot", "Tumbler basso", "Shake (ghiaccio tritato)", "", ["30 ml rum giamaicano", "22,5 ml rum portoricano oro", "6 dash pastis", "22,5 ml rum overproof", "15 ml falernum", "15 ml sciroppo di cannella", "15 ml succo di pompelmo bianco", "15 ml succo di lime", "1 dash angostura"], "2 ciliegie al maraschino, 2 foglie di ananas, rametto di menta", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio tritato e filtrate in un tumbler basso sopra ghiaccio tritato. Infine, decorate con 2 ciliegie al maraschino su uno spiedino, 2 foglie di ananas e un rametto di menta."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Missionary’s Downfall", "Hurricane", "Blend", "", ["30 ml rum bianco invecchiato", "15 ml apricot brandy", "30 ml Don’s Mix", "45 ml succo di ananas", "15 ml succo di lime", "10-15 foglie di menta fresca"], "rametti di menta, spicchio di ananas, rondella di lime incisa", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio tritato e frullate ad alta velocità fino a ottenere un composto liscio (circa 15-20 secondi). Versate in un bicchiere hurricane e decorate con un generoso mazzetto di menta, uno spicchio di ananas e una rondella di lime incisa."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Death Valley at Sunset", "Coppetta", "Shake", "", ["60 ml tequila lavata all’olio di avocado", "7,5 ml liquore al chile", "30 ml purea di papaya", "22,5 ml Don’s Mix", "22,5 ml succo di lime"], "bordo di sale al chile", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (fine strain) in una coppetta ghiacciata con il bordo di sale al chile."], ["Tequila lavata all’olio di avocado", "Unite 120 ml di olio di avocado e 475 ml di tequila in un contenitore di vetro o non poroso e non reattivo, e lasciate in infusione a temperatura ambiente per 4-6 ore. Coprite e trasferite nel freezer per altre 8 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate la tequila due volte con una garza prima di usarla."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Almost Famous", "Coppetta", "Shake", "", ["30 ml rum giamaicano overproof", "30 ml Chartreuse gialla", "30 ml Aperol", "30 ml succo di lime"], "rondella di lime disidratata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate con una rondella di lime disidratata."], ["Nota", "Variante del Paper Plane di Laura Bishop (Liberty Bar e Navy Strength, Seattle)."]], "Tiki & Rum", 1],
["Lake at Night", "Coppetta", "Shake", "", ["60 ml vodka al tè affumicato", "7,5 ml blue curaçao", "7,5 ml sciroppo di miele", "15 ml succo di limone", "2 dash cardamom bitter"], "scorza d’arancia", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (double strain) in una coppetta ghiacciata o in un bicchiere Nick and Nora. Infine, decorate con una scorza d’arancia."], ["Vodka al tè affumicato", "Fate in infusione 2-3 cucchiaini (10-15 ml) di foglie di tè nero affumicato (Lapsang souchong) in 180 ml di acqua calda per 2-3 minuti. Scolate l’acqua e trasferite le foglie bagnate in un contenitore di vetro o non poroso, aggiungendo 750 ml di vodka. Lasciate in infusione a temperatura ambiente per 5-7 minuti, quindi scolate ed eliminate le foglie prima che il tè si estragga troppo. Travasate in una bottiglia pulita e conservate in un luogo fresco, lontano dalla luce. La vodka si conserva a tempo indefinito."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Quarterdeck", "Coppetta", "Shake", "", ["60 ml gin navy strength", "7,5 ml liquore allo yuzu", "15 ml sciroppo al tè verde", "15 ml succo di limone"], "scorza di lime grattugiata, rondella di lime disidratata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (double strain) in una coppetta ghiacciata. Infine, decorate con scorza di lime appena grattugiata o una rondella di lime disidratata."], ["Variante", "Aggiungete allo shaker una fettina di cetriolo fresco per una leggera nota di melone e più freschezza; in questo caso decorate con un’altra fettina di cetriolo al posto della rondella di lime."]], "Tiki & Rum", 1],
["Escape to Fantasy Island", "Coppetta", "Shake", "", ["60 ml rum navy style", "15 ml liquore all’ananas", "22,5 ml sciroppo di zenzero", "30 ml purea di mango", "22,5 ml succo di lime"], "rondella di lime disidratata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate con una rondella di lime disidratata."], ["Sciroppo di zenzero", "Seguite la ricetta dello sciroppo semplice e, quando arriva a sobbollire, aggiungete fino a 115 g di zenzero fresco sbucciato e tagliato a rondelle sottili. Lasciate in infusione per 45 minuti prima di filtrare ed eliminare i solidi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Tour le Carbet", "Coppetta", "Shake", "", ["60 ml rhum agricole 100 proof", "15 ml Suze", "22,5 ml falernum", "22,5 ml succo di lime"], "rondella di lime", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate (double strain) in una coppetta ghiacciata. Infine, decorate con una rondella di lime."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["Parasol", "Coppetta", "Shake", "", ["60 ml rum bianco invecchiato", "22,5 ml sciroppo di banana", "15 ml succo di ananas", "22,5 ml succo di lime"], "noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate con noce moscata appena grattugiata."], ["Parasol Pop", "Ghiacciolo da picnic o pool party: in un contenitore di vetro o non poroso e non reattivo unite 350 ml di rum bianco invecchiato, 90 ml di rum demerara overproof, 60 ml di sciroppo speziato, 120 ml di purea di banana congelata (scongelata leggermente), 120 ml di succo di ananas e 120 ml di succo di lime, e mescolate. Trasferite negli stampi per ghiaccioli, inserite i bastoncini e congelate per almeno 24 ore prima di sformare. Dà 6 ghiaccioli da 120 ml."]], "Tiki & Rum", 1],
["Isla de Piña", "Coppetta", "Flash Blend (ghiaccio tritato)", "", ["60 ml rum bianco invecchiato", "15 ml liquore all’ananas", "7,5 ml pimento dram", "15 ml purea di frutto della passione", "15 ml succo di lime"], "2-3 foglie di ananas fissate al bicchiere con una molletta", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con pochissimo ghiaccio tritato. Frullate con mixer a immersione per 5-10 secondi (flash blend) e filtrate (fine strain) in una coppetta ghiacciata. Infine, decorate."]], "Tiki & Rum", 1],
["California Condor", "Coppetta", "Shake", "", ["30 ml rum bianco invecchiato", "22,5 ml rum invecchiato stile Saint Lucia", "22,5 ml succo di ananas", "22,5 ml lime cordial", "15 ml succo di lime", "8 gocce mole bitter", "8 gocce habanero shrub"], "scorza d’arancia (oli essenziali spruzzati sul drink)", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate (fine strain) in una coppetta ghiacciata. Infine, spruzzate gli oli essenziali di una scorza d’arancia."], ["Lime cordial", "In un pentolino unite parti uguali di succo di lime appena spremuto e sciroppo di zucchero. Portate a sobbollire a fuoco medio, mescolando ogni tanto, e cuocete per circa 15 minuti."], ["Nota", "Ricetta di Will Elliott (Maison Premiere e Sauvage, Brooklyn)."]], "Tiki & Rum", 1],
["Message in a Bottle", "Snifter", "Shake (ghiaccio tritato)", "", ["30 ml rum infuso alla foglia di lime kaffir", "30 ml rhum agricole blanc 100 proof", "7,5 ml orange curaçao", "15 ml sciroppo di zenzero", "15 ml succo di litchi", "22,5 ml succo di lime"], "foglia di banano, spiedo di ananas, foglia di lime kaffir", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in uno snifter pieno di ghiaccio tritato. Servite con cannucce di bambù e decorate con foglia di banano, spiedo di ananas o foglia di lime kaffir."], ["Rum infuso alla foglia di lime kaffir", "Unite 1 foglia fresca di lime kaffir e 375 ml di rum bianco invecchiato in un contenitore di vetro o non poroso e non reattivo. Lasciate in infusione a temperatura ambiente per 2 ore. Scolate ed eliminate la foglia prima dell’uso. Travasate in una bottiglia pulita e conservate in frigorifero a tempo indefinito."], ["Sciroppo di zenzero", "Seguite la ricetta dello sciroppo semplice e, quando arriva a sobbollire, aggiungete fino a 115 g di zenzero fresco sbucciato e tagliato a rondelle sottili. Lasciate in infusione per 45 minuti prima di filtrare ed eliminare i solidi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Jade Merchant No. 2", "Tumbler basso", "Shake", "", ["2-3 rametti di menta fresca", "2 fettine di cetriolo", "15 ml succo di lime", "90 ml shochu lavato all’olio di avocado", "15 ml sciroppo al tè verde", "7,5 ml succo di aloe vera"], "striscia di cetriolo, rametti di menta, guscio di lime inciso", [["Preparazione", "In uno shaker pestate menta, cetriolo e succo di lime. Aggiungete gli altri ingredienti e shakerate per raffreddare. Filtrate in un tumbler basso (double rocks) ghiacciato, foderato con una striscia di cetriolo, su ghiaccio tritato. Infine, decorate con un generoso mazzetto di menta e un guscio di lime inciso."], ["Shochu lavato all’olio di avocado", "Unite 240 ml di olio di avocado e 750 ml di shochu in un contenitore di vetro o non poroso e non reattivo con coperchio. Agitate per mescolare, poi lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per altre 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate lo shochu due volte con una garza prima di usarlo."]], "Tiki & Rum", 1],
["Little Grove", "Tumbler alto", "Shake", "", ["45 ml arrack Batavia", "45 ml shochu", "7,5 ml liquore allo zenzero", "30 ml acqua di cocco infusa al riso", "15 ml sciroppo alla citronella", "15 ml succo di lime"], "rondella di lime", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler alto su ghiaccio tritato. Infine, decorate con una rondella di lime."], ["Acqua di cocco infusa al riso", "In un contenitore non reattivo unite 475 ml di acqua di cocco al 100% e ½ tazza (circa 100 g) di riso rosso, integrale o basmati. Refrigerate per 10-12 ore o per tutta la notte, poi scolate ed eliminate il riso. In un contenitore ermetico l’acqua di cocco infusa si conserva 1 settimana in frigorifero."]], "Tiki & Rum", 1],
["Sunset Kid", "Pilsner", "Shake (ghiaccio tritato)", "", ["60 ml tequila reposado", "15 ml Cynar", "7,5 ml Fernet Menta", "22,5 ml sciroppo di cannella", "22,5 ml purea di arancia rossa", "22,5 ml succo di lime", "2 dash abbondanti di angostura"], "rondella di arancia rossa disidratata, 2-3 foglie di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un bicchiere pilsner ghiacciato su ghiaccio tritato. Infine, decorate con una rondella di arancia rossa disidratata e 2-3 foglie di ananas."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Flaneuse", "Hurricane", "Flash Blend (ghiaccio tritato)", "", ["60 ml rhum agricole blanc", "30 ml sherry amontillado", "7,5 ml Becherovka", "15 ml sciroppo di cocco tostato", "15 ml purea di papaya", "22,5 ml succo di lime"], "fiore edibile, spicchio di ananas disidratato, foglia di banano", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con ghiaccio leggero. Frullate con mixer a immersione per 10-15 secondi per aerare e raffreddare. Versate in un bicchiere hurricane ghiacciato pieno di ghiaccio. Infine, decorate con un fiore edibile, uno spicchio di ananas disidratato e una foglia di banano."], ["Sciroppo di cocco tostato", "Tostate circa 45 g di cocco non zuccherato in una padella asciutta a fuoco medio-basso, finché è profumato e dorato. Unite il cocco tostato a 240 ml di acqua di cocco e circa 340 g di miele e seguite la ricetta dello sciroppo semplice, facendo sobbollire per circa 30 minuti. Lasciate raffreddare, filtrate ed eliminate i solidi. Con lo zucchero semolato al posto del miele si ottiene una versione più brillante e dolce. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Cicada", "Pilsner", "Shake (ghiaccio tritato)", "", ["45 ml pisco", "15 ml acquavite all’anice", "15 ml Chartreuse verde", "15 ml assenzio", "15 ml sciroppo di miele", "15 ml succo di guanabana (soursop)", "15 ml purea di papaya", "22,5 ml succo di lime", "top 15 ml fernet"], "generoso rametto di menta", [["Preparazione", "Shakerate tutti gli ingredienti tranne il fernet con ghiaccio a cubetti e filtrate in un bicchiere pilsner ghiacciato su ghiaccio tritato. Completate con il fernet e altro ghiaccio tritato. Infine, decorate con un generoso rametto di menta."], ["Acquavite infusa all’anice", "Unite 2 cucchiai di semi di anice interi e 1 litro di acquavite (aguardiente) in un contenitore di vetro o non poroso e non reattivo. Mescolate delicatamente, poi lasciate in infusione a temperatura ambiente per 24 ore. Filtrate (fine strain) ed eliminate i semi. Travasate in una bottiglia pulita e conservate a tempo indefinito in un luogo fresco, lontano dalla luce diretta del sole."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Tigershark", "Snifter", "Flash Blend (ghiaccio tritato)", "", ["60 ml bourbon whiskey lavato all’olio di cocco", "15 ml sciroppo alla citronella", "15 ml falernum", "15 ml succo di lime", "2 dash angostura"], "fiore edibile, rondella di lime disidratata", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con ghiaccio leggero. Frullate con mixer a immersione per 10 secondi per raffreddare e aerare. Filtrate in uno snifter su ghiaccio tritato. Infine, decorate con un fiore edibile e una rondella di lime disidratata."], ["Bourbon lavato all’olio di cocco", "Unite 180 ml di olio di cocco non raffinato (necessario per l’effetto desiderato: quello raffinato è inodore e insapore) e 750 ml di bourbon in un contenitore di vetro o non poroso e non reattivo con coperchio. Agitate per mescolare, poi lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate il bourbon due volte con una garza prima di usarlo."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."]], "Tiki & Rum", 1],
["Java Jade", "Hurricane", "Shake (ghiaccio tritato)", "", ["45 ml gin invecchiato in botte", "15 ml arrack Batavia", "7,5 ml crème de menthe", "15 ml sciroppo di cocco tostato", "15 ml Don’s Mix", "22,5 ml succo di lime"], "rametto di menta, scorza di lime grattugiata, fiore edibile", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate in un bicchiere hurricane (o Tiki mug) su ghiaccio tritato. Aggiungete altro ghiaccio tritato in cima, poi decorate con menta, scorza di lime appena grattugiata e un fiore edibile."], ["Sciroppo di cocco tostato", "Tostate circa 45 g di cocco non zuccherato in una padella asciutta a fuoco medio-basso, finché è profumato e dorato. Unite il cocco tostato a 240 ml di acqua di cocco e circa 340 g di miele e seguite la ricetta dello sciroppo semplice, facendo sobbollire per circa 30 minuti. Lasciate raffreddare, filtrate ed eliminate i solidi. Con lo zucchero semolato al posto del miele si ottiene una versione più brillante e dolce. Si conserva in frigorifero fino a 2 settimane."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Good Fortune", "Tumbler basso", "Shake", "", ["15 ml pastis (per sciacquare il bicchiere)", "15 ml sciroppo di mango", "5-6 foglie di menta", "60 ml bourbon whiskey lavato all’olio di Szechuan", "15 ml succo di litchi", "22,5 ml succo di limone"], "rametto di menta, noce moscata grattugiata", [["Preparazione", "Sciacquate un tumbler basso con il pastis: versate 15 ml, fateli roteare per rivestire l’interno del bicchiere e poi eliminateli. Pestate sciroppo e menta nello shaker, aggiungete gli altri ingredienti e shakerate. Filtrate nel tumbler e completate con ghiaccio tritato. Infine, decorate con menta e una spolverata di noce moscata appena grattugiata."], ["Bourbon lavato all’olio di Szechuan", "Unite 180 ml di olio di peperoncino Szechuan (si trova online o in negozi specializzati) e 750 ml di bourbon in un contenitore di vetro o non poroso e non reattivo con coperchio. Agitate per mescolare, poi lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per altre 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate il bourbon due volte con una garza prima di usarlo."]], "Tiki & Rum", 1],
["Five Knots", "Tumbler basso", "Shake (ghiaccio tritato)", "", ["45 ml rum giamaicano pot still", "30 ml rhum agricole ambrato", "15 ml crème de cacao", "15 ml sciroppo di caffè", "15 ml succo di frutto della passione", "22,5 ml succo di lime", "2 dash mole bitter"], "stecca di cannella tostata, noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate in un tumbler basso su ghiaccio tritato. Infine, decorate con una stecca di cannella tostata e noce moscata appena grattugiata."], ["Sciroppo di caffè", "Seguite la ricetta dello sciroppo semplice usando caffè preparato al posto dell’acqua. Per un sapore più intenso e potente si può fare un caffè double-brew (metà della quantità di acqua usuale). Si consigliano caffè monorigine scuri (Messico, Guatemala, Sumatra) o una miscela con uno o più di questi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Magpie", "Tumbler alto", "Shake (ghiaccio tritato)", "", ["60 ml cachaça non invecchiata", "22,5 ml Campari", "15 ml sciroppo di papaya", "30 ml succo di carota", "22,5 ml succo di lime"], "fiori edibili, spicchio di lime inciso", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler alto ghiacciato su ghiaccio tritato. Infine, decorate con fiori edibili e uno spicchio di lime inciso."]], "Tiki & Rum", 1],
["Wingman", "Tumbler basso", "Stir", "", ["60 ml rum lavato al burro nocciola", "30 ml Campari", "15 ml falernum infuso alla foglia di lime kaffir", "top sidro di mela o di ananas"], "foglie di ananas", [["Preparazione", "Mescolate i primi tre ingredienti in un mixing glass con ghiaccio leggero per raffreddare e diluire. Versate in un tumbler basso su un grosso cubo di ghiaccio, completate con il sidro e decorate con foglie di ananas fresche."], ["Rum lavato al burro nocciola", "In un padellino scaldate 170 g di burro non salato a fuoco medio fino a farlo sciogliere. Continuate a cuocere facendo roteare costantemente il padellino, finché il burro schiuma, imbrunisce e sa di nocciola (può servire un paio di minuti, ma accade all’improvviso). Togliete subito dal fuoco e lasciate raffreddare leggermente. Unite il burro nocciola a 700 ml di rum in un contenitore di vetro o non poroso e non reattivo con coperchio. Mescolate, poi lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per altre 4 ore o per tutta la notte, finché il burro si solidifica. Togliete dal freezer, eliminate il burro solidificato e sgrassate eventuali residui. Filtrate il rum due volte con una garza, eliminando i residui solidi. Travasate in una bottiglia pulita e conservate in frigorifero fino a 4 settimane."], ["Falernum infuso alla foglia di lime kaffir", "Unite 475 ml di falernum e 1 foglia di lime kaffir leggermente schiacciata in un contenitore di vetro o non poroso e non reattivo e lasciate in infusione a temperatura ambiente per 2 ore. Prima dell’uso, eliminate la foglia e travasate in una bottiglia pulita. Conservate in frigorifero a tempo indefinito."], ["Nota", "Può essere servito direttamente nella lattina di sidro all’ananas: mescolate rum, Campari e falernum, e versateli nella lattina dopo qualche sorso di sidro freddo."]], "Tiki & Rum", 1],
["Lorikeet", "Tumbler alto", "Shake (ghiaccio tritato)", "", ["60 ml rye whiskey", "15 ml liquore alla banana", "7,5 ml sciroppo di cannella", "30 ml succo di ananas", "22,5 ml succo di limone", "6 dash Peychaud’s bitters", "4 dash angostura"], "twist d’arancia, 2 spiedi di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate in un tumbler alto. Completate con ghiaccio tritato e decorate con un twist d’arancia e 2 spiedi di ananas."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Cockpit Cooler", "Pilsner", "Shake", "", ["60 ml rum giamaicano overproof", "5 ml pimento dram", "22,5 ml sciroppo di cocco tostato", "30 ml succo di carota", "30 ml succo di guanabana (soursop)", "22,5 ml succo di lime"], "foglia di banano, noce moscata grattugiata, ombrellino di carta", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un bicchiere pilsner ghiacciato (o julep cup) foderato con una foglia di banano, su ghiaccio a cubetti. Completate con ghiaccio tritato e decorate con noce moscata appena grattugiata e un ombrellino di carta."], ["Sciroppo di cocco tostato", "Tostate circa 45 g di cocco non zuccherato in una padella asciutta a fuoco medio-basso, finché è profumato e dorato. Unite il cocco tostato a 240 ml di acqua di cocco e circa 340 g di miele e seguite la ricetta dello sciroppo semplice, facendo sobbollire per circa 30 minuti. Lasciate raffreddare, filtrate ed eliminate i solidi. Con lo zucchero semolato al posto del miele si ottiene una versione più brillante e dolce. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Tiger Lily", "Hurricane", "Flash Blend (ghiaccio tritato)", "", ["45 ml pisco", "15 ml liquore allo yuzu", "4 ml liquore ai fiori di sambuco", "30 ml succo di pompelmo bianco", "15 ml sciroppo di miele", "2 dash angostura"], "spiedo di ananas, twist d’arancia, fiore edibile", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con un piccolo mestolo di ghiaccio tritato. Frullate con mixer a immersione per 10-15 secondi: il liquido deve risultare leggermente schiumoso. Filtrate in un bicchiere hurricane su ghiaccio tritato. Infine, decorate con uno spiedo di ananas, un twist d’arancia e un fiore edibile."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Royal Peacock", "Tumbler alto", "Shake", "", ["45 ml rhum agricole blanc", "15 ml mezcal", "15 ml liquore al frutto della passione", "7,5 ml sciroppo di zucchero", "22,5 ml succo di mango", "15 ml succo di lime", "1 dash habanero shrub"], "3 foglie di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler alto con il bordo di sale al chile, su ghiaccio. Infine, decorate con 3 foglie di ananas."], ["Nota", "Ricetta di Dani DeLuna (Brooklyn), ispirata al Planteur."]], "Tiki & Rum", 1],
["Kingston Soundsystem", "Tumbler basso", "Shake", "", ["45 ml rum giamaicano overproof", "15 ml Suze", "22,5 ml succo di guanabana (soursop)", "22,5 ml succo di lime"], "rondella di lime disidratata, foglia di ananas", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler basso su ghiaccio a cubetti. Infine, decorate con una rondella di lime disidratata e una foglia di ananas."], ["Nota", "Rovesciamento del Jungle Bird: rum non invecchiato al posto del blackstrap, Suze al posto del Campari e guanabana al posto dell’ananas."]], "Tiki & Rum", 1],
["Kill Devyl Reef", "Snifter", "Shake (ghiaccio tritato)", "", ["60 ml rum demerara", "15 ml rhum agricole", "15 ml rum giamaicano overproof", "15 ml allspice dram", "15 ml miele", "30 ml succo di frutto della passione", "22,5 ml succo di lime"], "rametto di menta, noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in uno snifter (o Tiki mug) su ghiaccio tritato. Infine, decorate con menta e noce moscata appena grattugiata."]], "Tiki & Rum", 1],
["Plank Walk", "Snifter", "Flash Blend (ghiaccio tritato)", "", ["60 ml rum navy style", "15 ml rum demerara overproof", "15 ml orange curaçao", "15 ml sciroppo di papaya", "15 ml sciroppo di cannella", "22,5 ml succo di lime"], "noce moscata grattugiata, guscio di lime fiammeggiato", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con ghiaccio. Frullate con mixer a immersione per 15 secondi e versate in uno snifter (o Tiki mug). Completate con ghiaccio tritato. Infine, decorate con noce moscata appena grattugiata e un guscio di lime fiammeggiato."], ["Sciroppo di cannella", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate. Aggiungetele allo sciroppo semplice quando arriva a sobbollire, poi filtrate ed eliminate le spezie a sciroppo freddo (è lo sciroppo speziato senza chiodi di garofano). Si conserva in frigorifero fino a 2 settimane."], ["Guscio di lime fiammeggiato", "Dopo aver spremuto mezzo lime, resta il guscio. Con un coltello affilato togliete la polpa dall’interno di un lime tagliato a metà, lasciando intatta la scorza, per ottenere una piccola ciotola. Imbevete una zolletta di zucchero con rum 151 proof, mettetela nel guscio, posizionate il guscio nel drink e aggiungete un altro goccio di rum. Poco prima di servire, accendete con cautela con un cannello da cucina o un lungo fiammifero (mai un accendino). Spolverando cannella in polvere sulla fiamma si creano scintille brevi ma scenografiche. Funziona meglio su drink serviti su ghiaccio tritato o come centrotavola di una Tiki bowl. Con ogni fiamma libera, soprattutto con alcolici ad alta gradazione, state molto attenti: lavorate in un ambiente ben ventilato lontano da materiali infiammabili, evitate abiti larghi, arrotolate le maniche e legate i capelli, tenete a portata di mano un estintore funzionante (e sappiate usarlo). Versate prima il rum, poi chiudete e allontanate la bottiglia prima di introdurre la fiamma: non provate mai ad accendere la decorazione mentre versate."]], "Tiki & Rum", 1],
["Maiden Voyage", "Snifter", "Shake (ghiaccio tritato)", "", ["45 ml gin invecchiato in botte", "22,5 ml calvados", "7,5 ml Becherovka", "15 ml orange curaçao", "15 ml sciroppo di vaniglia", "30 ml succo di ananas", "22,5 ml succo di lime"], "guscio di lime inciso, stecca di cannella tostata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in uno snifter, riempiendolo di ghiaccio tritato. Infine, decorate con un guscio di lime inciso e una stecca di cannella tostata."], ["Sciroppo di vaniglia", "Due modi: aggiungete fino a 15 ml di estratto di vaniglia all’acqua della ricetta dello sciroppo Demerara; oppure, per lo stile autentico dei classici Tiki bar, versate lo sciroppo semplice caldo su 1 baccello di vaniglia aperto per il lungo in un barattolo o una bottiglia di vetro e lasciate raffreddare. Con l’estratto si conserva in frigorifero fino a 2 settimane, con il baccello 1 settimana."]], "Tiki & Rum", 1],
["Poolside", "Tumbler alto", "Flash Blend (ghiaccio tritato)", "", ["30 ml rum navy style", "15 ml cachaça invecchiata", "15 ml sciroppo di zenzero", "15 ml banana milk", "15 ml succo di papaya", "15 ml succo di limone"], "scorza di lime grattugiata", [["Preparazione", "Mettete tutti gli ingredienti in un frullatore con ghiaccio. Frullate per 8-10 secondi (flash blend) e versate in una swizzle cup o in un tumbler alto. Infine, decorate con scorza di lime appena grattugiata."], ["Sciroppo di zenzero", "Seguite la ricetta dello sciroppo semplice e, quando arriva a sobbollire, aggiungete fino a 115 g di zenzero fresco sbucciato e tagliato a rondelle sottili. Lasciate in infusione per 45 minuti prima di filtrare ed eliminare i solidi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Ghost of the Mariner", "Tiki", "Shake (ghiaccio tritato)", "", ["60 ml rum infuso a caffè, cacao e cicoria", "15 ml mezcal", "15 ml sciroppo di cocco e miele tostati", "15 ml orzata", "22,5 ml succo di lime"], "noce moscata grattugiata, stecca di cannella tostata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un Tiki mug su ghiaccio tritato. Infine, decorate con noce moscata appena grattugiata e una stecca di cannella tostata."], ["Rum infuso a caffè, cacao e cicoria", "Con l’aiuto di un imbuto unite 700 ml di rum invecchiato, ½ cucchiaio di caffè macinato finemente, ¼ di cucchiaino di cicoria macinata finemente e ¼ di tazza (circa 60 ml) di nibs di cacao crudo in un contenitore di vetro o non poroso e non reattivo (oppure aggiungete le spezie direttamente nella bottiglia del rum). Lasciate riposare a temperatura ambiente per almeno 24 ore. Travasate il rum e filtratelo con una garza prima dell’uso."], ["Orzata", "Sciroppo a base di mandorla, forma concentrata dell’horchata: aromi floreali e zuccheri leggermente caramellati, ottimo con i sapori terrosi del rum dei Caraibi. L’autore preferisce acquistarla (L’Orgeat, Small Hand Foods, Beachbum Berry); in alternativa vedi la ricetta di orzata alle noci macadamia del Mr. Bodi Hai."]], "Tiki & Rum", 1],
["Land of the Lost", "Hurricane", "Flash Blend (ghiaccio tritato)", "", ["60 ml pisco amburana", "15 ml acquavite overproof", "7,5 ml liquore al chile ancho", "15 ml sciroppo di miele", "15 ml purea di guava", "22,5 ml succo di lime", "4 dash mole bitter"], "spruzzata di assenzio, rametto di menta", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con ghiaccio. Frullate con mixer a immersione per 8-10 secondi e versate in un bicchiere hurricane (o pilsner) su ghiaccio tritato. Infine, decorate con una spruzzata di assenzio e un rametto di menta."], ["Sciroppo di miele", "Stessa preparazione dello sciroppo semplice 1:1 (240 ml di acqua e 240 g di miele di qualsiasi varietà: millefiori, grano saraceno o il vostro preferito), mescolando fino a sciogliere. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Aguila de Desierto", "Tiki", "Shake (ghiaccio tritato)", "", ["60 ml tequila reposado", "22,5 ml tepache", "22,5 ml liquore alla banana", "22,5 ml sciroppo di miele salato", "22,5 ml succo di lime", "2 dash habanero shrub"], "spicchio di lime inciso, stecca di cannella tostata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e versate tutto il contenuto in un Tiki mug alto (o a teschio). Completate con ghiaccio tritato. Infine, decorate con uno spicchio di lime inciso e una stecca di cannella tostata."], ["Tepache", "Tagliate a cubetti, senza sbucciare, 1 ananas maturo (eliminando il torsolo) e unitelo a 5 ml di chiodi di garofano interi e 3 stecche di cannella in un contenitore non poroso e non reattivo. Pestate ananas e spezie, poi aggiungete circa 800 g di zucchero di canna e pestate di nuovo, distribuendo bene lo zucchero. Aggiungete circa 1,9 litri di acqua e mescolate, poi coprite bene e lasciate riposare indisturbato a temperatura ambiente per almeno 8 ore o per tutta la notte. Mescolate di nuovo e aggiungete circa 950 ml di birra lager. Rimettete il coperchio e lasciate riposare per altre 48 ore. Dopo il secondo giorno la miscela deve essere frizzante (segno che è fermentata); se non è pronta, lasciate riposare un altro giorno. Eliminate i solidi e filtrate il liquido in una bottiglia o in un contenitore pulito. Si possono provare altre spezie (pepe in grani, coriandolo, grani del paradiso) per effetti diversi. Conservate in frigorifero fino a 1 settimana."], ["Sciroppo di miele salato", "Preparate lo sciroppo di miele 1:1 (stesse dosi dello sciroppo semplice, con miele) aggiungendo una generosa presa di sale marino all’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Medicine Woman", "Tiki", "Shake (ghiaccio tritato)", "", ["30 ml mezcal", "30 ml acquavite infusa all’anice", "2 dash liquore al chile verde", "15 ml Cynar", "22,5 ml sciroppo di caffè", "15 ml sciroppo di mango", "22,5 ml succo di lime"], "rametto di menta, spiedi di ananas, spicchio di ananas disidratato", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un Tiki mug su ghiaccio tritato. Infine, decorate con menta, spiedi di ananas e uno spicchio di ananas disidratato."], ["Nota", "Acquavite infusa all’anice: vedi la ricetta del Cicada."], ["Sciroppo di caffè", "Seguite la ricetta dello sciroppo semplice usando caffè preparato al posto dell’acqua. Per un sapore più intenso e potente si può fare un caffè double-brew (metà della quantità di acqua usuale). Si consigliano caffè monorigine scuri (Messico, Guatemala, Sumatra) o una miscela con uno o più di questi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Peg Leg", "Tumbler basso", "Shake", "", ["45 ml bourbon whiskey infuso all’olio di sesamo", "15 ml blended scotch whisky", "2 dash crème de cacao", "15 ml CioCiaro", "22,5 ml falernum", "15 ml orzata"], "rondella di limone disidratata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un tumbler basso pieno di ghiaccio. Infine, decorate con una rondella di limone disidratata."], ["Bourbon infuso all’olio di sesamo", "Unite 180 ml di olio di sesamo e 750 ml di bourbon (bonded) in un contenitore di vetro o non poroso e non reattivo con coperchio. Agitate per mescolare, poi lasciate in infusione a temperatura ambiente per 6 ore. Trasferite nel freezer per 4 ore o per tutta la notte, finché l’olio si solidifica. Togliete dal freezer, eliminate l’olio solidificato e sgrassate eventuali residui. Filtrate due volte con una garza prima di usare."], ["Falernum", "Infuso a base di rum di Barbados aromatizzato con scorza di lime, zenzero, chiodi di garofano e mandorle: ingrediente classico del Tiki che aggiunge spezie e acidità. Si può fare in casa ma richiede molto lavoro, per cui l’autore consiglia di acquistarlo (John D. Taylor’s Velvet Falernum, per costanza e stile)."], ["Orzata", "Sciroppo a base di mandorla, forma concentrata dell’horchata: aromi floreali e zuccheri leggermente caramellati, ottimo con i sapori terrosi del rum dei Caraibi. L’autore preferisce acquistarla (L’Orgeat, Small Hand Foods, Beachbum Berry); in alternativa vedi la ricetta di orzata alle noci macadamia del Mr. Bodi Hai."]], "Tiki & Rum", 1],
["Brown Bomba", "Hurricane", "Shake (ghiaccio tritato)", "", ["30 ml irish whiskey", "30 ml rum giamaicano pot still", "7,5 ml liquore al tamarindo", "15 ml miele", "15 ml purea di banana", "22,5 ml succo di lime", "2 dash mole bitter"], "noce moscata grattugiata", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e filtrate in un bicchiere hurricane su ghiaccio tritato. Infine, decorate con noce moscata appena grattugiata."]], "Tiki & Rum", 1],
["Strangers in Paradise", "Tiki", "Shake (ghiaccio tritato)", "", ["30 ml rhum agricole blanc", "15 ml rum invecchiato", "15 ml mezcal", "15 ml liquore allo zenzero", "22,5 ml sciroppo di macadamia", "22,5 ml succo di lime", "4 ml Fernet Vallet (float)"], "guscio di lime inciso, menta fresca, 2-3 spiedi di ananas, spicchio di ananas disidratato", [["Preparazione", "Shakerate tutti gli ingredienti tranne il fernet con ghiaccio a cubetti e versate tutto il contenuto in un Tiki mug alto (o a teschio). Completate con ghiaccio tritato e fate galleggiare il fernet in superficie. Infine, decorate con un guscio di lime inciso, menta fresca, 2-3 spiedi di ananas e uno spicchio di ananas disidratato."]], "Tiki & Rum", 1],
["Pearl of the Deep", "Snifter", "Shake", "", ["45 ml rum demerara invecchiato", "7,5 ml rhum agricole", "22,5 ml sciroppo di caffè", "15 ml purea di arancia rossa", "15 ml succo di ananas", "22,5 ml succo di lime"], "rondella di arancia rossa disidratata, twist d’arancia inciso", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio e filtrate in uno snifter su ghiaccio. Infine, decorate con una rondella di arancia rossa disidratata e un twist d’arancia inciso."], ["Sciroppo di caffè", "Seguite la ricetta dello sciroppo semplice usando caffè preparato al posto dell’acqua. Per un sapore più intenso e potente si può fare un caffè double-brew (metà della quantità di acqua usuale). Si consigliano caffè monorigine scuri (Messico, Guatemala, Sumatra) o una miscela con uno o più di questi. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Mutiny on the Bounty", "Tiki", "Shake", "", ["45 ml rum giamaicano pot still", "15 ml gin infuso al tè Darjeeling", "15 ml sciroppo speziato", "15 ml succo di mandarino", "22,5 ml succo di lime"], "rametto di menta, fiore edibile, rondella di lime incisa, spicchio di ananas disidratato", [["Preparazione", "Shakerate tutti gli ingredienti con ghiaccio a cubetti e versate tutto il contenuto in un Tiki mug, completando con ghiaccio tritato. Infine, decorate con menta, un fiore edibile, una rondella di lime incisa e uno spicchio di ananas disidratato."], ["Gin infuso al tè Darjeeling", "Fate in infusione 2-3 cucchiaini (10-15 ml) di foglie di tè Darjeeling sfuso in 180 ml di acqua calda per 2-3 minuti. Scolate l’acqua e trasferite le foglie bagnate in un contenitore di vetro o non poroso e non reattivo, aggiungendo 750 ml di gin (meglio se navy strength) e mescolando. Lasciate in infusione a temperatura ambiente per 5-7 minuti. Filtrate (fine strain) ed eliminate le foglie prima che il tè si estragga troppo: se lasciato troppo, il risultato sarà eccessivamente tannico e amaro. Travasate in un contenitore o una bottiglia pulita e conservate in un luogo fresco, lontano dalla luce. Il gin infuso al tè si conserva a tempo indefinito."], ["Sciroppo speziato", "Tostate 3-4 stecche di cannella in una padella asciutta a fuoco medio-basso, finché sono profumate (possono sprigionare un po’ di fumo). Aggiungete la cannella e circa 1 g di chiodi di garofano interi allo sciroppo semplice quando arriva a sobbollire. Filtrate ed eliminate le spezie a sciroppo freddo. Senza chiodi si ottiene lo sciroppo di cannella. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Golden Barnacle", "Tumbler basso", "Flash Blend", "", ["30 ml rhum agricole blanc", "15 ml rum giamaicano pot still", "15 ml allspice dram", "30 ml Don’s Mix", "15 ml succo di lime"], "rondella di arancia rossa", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con 3-4 cubetti di ghiaccio (ghiaccio leggero). Frullate con mixer a immersione per 10-15 secondi e versate in un tumbler basso su ghiaccio. Infine, decorate con una rondella di arancia rossa."], ["Don’s Mix", "Ingrediente tiki inventato da Don the Beachcomber, che aggiunge dolcezza morbida e acidità ai drink complessi. Seguite la ricetta dello sciroppo di miele (1:1) con succo di pompelmo al posto dell’acqua. Si conserva in frigorifero fino a 2 settimane."]], "Tiki & Rum", 1],
["Mr. Bodi Hai", "Hurricane", "Shake (ghiaccio tritato)", "", ["45 ml rum invecchiato", "7,5 ml liquore al caffè", "7,5 ml liquore alla banana", "15 ml orzata alle noci macadamia", "45 ml succo di ananas", "22,5 ml succo di limone", "1 dash angostura"], "rondella di ananas, foglie di ananas", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker e aggiungete ghiaccio spezzato. Shakerate con vigore e versate tutto il contenuto in un bicchiere hurricane (o pilsner), completando con ghiaccio tritato. Infine, decorate con una rondella di ananas e foglie di ananas."], ["Orzata alle noci macadamia", "Preriscaldate il forno a 200 °C. Distribuite circa 140 g di noci macadamia tostate non salate su una teglia e infornate sulla griglia centrale finché sono profumate, circa 10 minuti. Togliete dal forno, lasciate raffreddare e trasferite le noci in un frullatore o in un robot da cucina insieme a circa 475 ml di acqua calda. Frullate alla massima velocità per circa 1 minuto, finché ben amalgamato e schiumoso. Filtrate (fine strain) con una garza o un chinois, eliminate i solidi e rimettete il liquido nello stesso frullatore. Aggiungete circa 200 g di zucchero e un pizzico di sale e frullate alla massima velocità per circa 1 minuto, finché lo zucchero è completamente sciolto. Filtrate in un contenitore di vetro con coperchio ermetico. L’orzata si conserva fino a 2 settimane in frigorifero."], ["Nota", "Ricetta di Nathan Hazard (Coconut Club, Los Angeles), rivisitazione del Mr. Bali Hai."]], "Tiki & Rum", 1],
["Headhunter", "Tiki", "Flash Blend (ghiaccio tritato)", "", ["30 ml mezcal", "30 ml rum giamaicano pot still", "7,5 ml Cardamaro", "4 ml Fernet Vallet", "30 ml horchata di riso rosso"], "menta, twist d’arancia, guscio di lime fiammeggiato", [["Preparazione", "Mettete tutti gli ingredienti in uno shaker con un po’ di ghiaccio tritato (meno di metà shaker). Frullate con mixer a immersione per 10-15 secondi, poi versate in un Tiki mug alto e completate con ghiaccio tritato. Infine, decorate con menta, un twist d’arancia e un guscio di lime fiammeggiato."], ["Horchata di riso rosso", "Tostate 1 stecca di cannella in una padella asciutta a fuoco medio fino a farla profumare. Lasciate raffreddare, spezzatela in pezzi più piccoli e unitela a circa 200 g di riso rosso o viola, circa 300 g di mandorle intere, circa 150 g di datteri Medjool denocciolati e 1 litro di acqua bollente in una ciotola grande, di vetro o non porosa e non reattiva. Lasciate in infusione a temperatura ambiente per 4 ore, poi filtrate (fine strain) con un chinois ed eliminate i solidi. L’horchata si conserva in un contenitore ermetico in frigorifero per 2-3 giorni."], ["Guscio di lime fiammeggiato", "Dopo aver spremuto mezzo lime, resta il guscio. Con un coltello affilato togliete la polpa dall’interno di un lime tagliato a metà, lasciando intatta la scorza, per ottenere una piccola ciotola. Imbevete una zolletta di zucchero con rum 151 proof, mettetela nel guscio, posizionate il guscio nel drink e aggiungete un altro goccio di rum. Poco prima di servire, accendete con cautela con un cannello da cucina o un lungo fiammifero (mai un accendino). Spolverando cannella in polvere sulla fiamma si creano scintille brevi ma scenografiche. Funziona meglio su drink serviti su ghiaccio tritato o come centrotavola di una Tiki bowl. Con ogni fiamma libera, soprattutto con alcolici ad alta gradazione, state molto attenti: lavorate in un ambiente ben ventilato lontano da materiali infiammabili, evitate abiti larghi, arrotolate le maniche e legate i capelli, tenete a portata di mano un estintore funzionante (e sappiate usarlo). Versate prima il rum, poi chiudete e allontanate la bottiglia prima di introdurre la fiamma: non provate mai ad accendere la decorazione mentre versate."]], "Tiki & Rum", 1],
